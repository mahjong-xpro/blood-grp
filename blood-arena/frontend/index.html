<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>血战到底</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="x" :class="{ 'x--done': state.gameEnded }">
        <header class="x-head">
            <span class="x-head-logo">血战到底</span>
            <span class="x-head-status" aria-live="polite">{{ state.status }}</span>
            <button v-if="!state.gameStarted || state.gameEnded" type="button" class="x-head-go" @click="tryStartGame">
                {{ state.gameEnded ? '再来一局' : '开始对局' }}
            </button>
        </header>

        <div class="x-board">
            <template v-for="z in playerZones" :key="z.zone">
                <div
                    class="x-side"
                    :data-side="z.zone"
                    :data-turn="state.currentActor === z.seat"
                    :aria-label="z.seat === state.myPlayerId ? '我的手牌' : '对手' + (z.seat + 1)"
                >
                    <div class="x-discards">
                        <img
                            v-for="(tile, ti) in state.players[z.seat].discards"
                            :key="'d-' + ti"
                            :src="getPaiImage(tile, z.pose)"
                            class="x-pic x-pic--s"
                            alt=""
                        >
                    </div>
                    <div
                        class="x-hand"
                        :data-hidden="z.seat !== state.myPlayerId"
                        :data-myturn="z.seat === state.myPlayerId && isMyTurn"
                    >
                        <template v-if="z.seat !== state.myPlayerId">
                            <img v-for="n in 13" :key="'b-' + n" :src="getPaiImage('?', z.pose)" class="x-pic" alt="">
                        </template>
                        <template v-else>
                            <div v-if="state.players[z.seat].melds.length" class="x-melds">
                                <div v-for="(m, mi) in state.players[z.seat].melds" :key="'g-' + mi" class="x-group">
                                    <img v-for="t in m.consumed" :key="t" :src="getPaiImage(t, z.pose)" class="x-pic x-pic--s" alt="">
                                    <img v-if="m.type !== 'ankan'" :src="getPaiImage(m.pai, z.pose)" class="x-pic x-pic--s x-pic--call" :data-down="z.zone === 'bottom'" alt="">
                                </div>
                            </div>
                            <img
                                v-for="(tile, i) in state.players[z.seat].tehai"
                                :key="'h-' + i"
                                :src="getPaiImage(tile, z.pose)"
                                class="x-pic x-pic--me"
                                role="button"
                                tabindex="0"
                                :aria-label="'出牌 ' + tile"
                                @click="handleTileClick(tile, i)"
                            >
                        </template>
                    </div>
                    <div class="x-meta">
                        <span class="x-meta-name">{{ state.players[z.seat].name }}</span>
                        <span class="x-meta-score">{{ state.players[z.seat].score }}</span>
                        <span v-if="state.players[z.seat].dingQueSuit" class="x-meta-dq" :data-suit="state.players[z.seat].dingQueSuit">{{ suitName(state.players[z.seat].dingQueSuit) }}</span>
                    </div>
                </div>
            </template>
            <div class="x-mid">
                <span v-if="state.tilesLeft != null" class="x-mid-num">剩 {{ state.tilesLeft }} 张</span>
            </div>
        </div>

        <div v-if="state.validActions.length > 0" class="x-actions" role="group" aria-label="可选操作">
            <button
                v-for="action in state.validActions"
                :key="action.label"
                type="button"
                class="x-act"
                :class="action.class"
                @click="sendAction(action)"
            >{{ action.label }}</button>
        </div>

        <div v-if="state.notification && !state.gameEnded" class="x-msg" role="alert">{{ state.notification }}</div>

        <div v-if="showResultPanel" class="x-end" role="dialog" aria-modal="true" aria-labelledby="x-end-title">
            <div class="x-end-bg" @click.self="tryStartGame"></div>
            <div class="x-end-box">
                <h2 id="x-end-title" class="x-end-title">对局结束</h2>
                <ul class="x-end-list">
                    <li v-for="(p, i) in state.players" :key="i" class="x-end-row"><span>{{ p.name }}</span><span>{{ p.score }} 分</span></li>
                </ul>
                <button type="button" class="x-head-go x-end-btn" @click="tryStartGame">再来一局</button>
            </div>
        </div>

        <pre v-if="state.debug" class="x-dbg" aria-hidden="true">{{ state.status }} {{ state.connected }} {{ state.isMyTurn }}</pre>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
