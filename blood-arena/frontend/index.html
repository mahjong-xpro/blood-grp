<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Blood Arena - Human vs AI</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">

    <!-- Dependencies -->
    <script src="/js/jquery-1.7.2.min.js"></script>
    <script src="/js/dytem.js"></script>

    <!-- Archive Player Logic (Rendering) -->
    <script src="/js/archive_player.js"></script>

    <!-- Inject global variables for archive_player just in case -->
    <script>
        var resourceDir = "static"; // Important: tell archive_player where images are
    </script>
</head>

<body>

    <!-- Status Bar -->
    <div id="status" style="text-align: center; color: white; background: #333; padding: 10px;">Connecting...</div>

    <!-- Controls Area -->
    <div id="controls" style="text-align: center; margin: 10px;"></div>

    <!-- Board Container (Structure required by archive_player.js) -->
    <div class="board">
        <div id="players" class="repeated player">
            <div class="ho">
                <div id="players.hoRows" class="repeated pai-row">
                    <img id="players.hoRows.pais" class="repeated">
                </div>
            </div>
            <div class="tehai-container pai-row">
                <img id="players.tehais" class="repeated">
                <img id="players.tsumoPai" class="tsumo-pai">
            </div>
            <div class="furo-container pai-row">
                <span id="players.furos" class="repeated">
                    <img id="players.furos.pais" class="repeated">
                </span>
            </div>
            <div class="player-footer"></div>
        </div>
        <div class="wanpais-container">
            <img id="wanpais" class="repeated">
        </div>
    </div>

    <!-- Controller (Hidden but might be useful for debug) -->
    <div class="controller-container" style="display:none;">
        <div>
            <select id="kyokuSelector"></select>
        </div>
        <div>
            <button id="prev-button">Prev</button>
            <button id="next-button">Next</button>
            <input id="action-id-label" type="text" size="3" value="0">
            <button id="go-button">Go</button>
            <button id="last-button" style="margin-left: 1em;">Last</button>
        </div>
        <table border="0">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Score</th>
                <th><button id="viewpoint-button">Viewpoint</button></th>
            </tr>
            <tr id="playerInfos" class="repeated">
                <td id="playerInfos.index"></td>
                <td id="playerInfos.name"></td>
                <td id="playerInfos.score"></td>
                <td id="playerInfos.viewpoint"></td>
            </tr>
        </table>
        <div>
            <pre id="action-label"></pre>
        </div>
        <div id="log-label" class="log-label"></div>
    </div>

    <!-- Game Logic -->
    <script src="/js/game.js"></script>

</body>

</html>
