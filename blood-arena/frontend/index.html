<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>血战到底</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="game">
    <div
        id="app"
        class="game-app"
        :class="{ 'game-app--my-turn': isMyTurn, 'game-app--over': state.gameEnded }"
    >
        <header class="game-bar">
            <h1 class="game-title">血战到底</h1>
            <p class="game-status" aria-live="polite">{{ state.status }}</p>
            <button
                v-if="!state.gameStarted || state.gameEnded"
                type="button"
                class="game-cta"
                @click="tryStartGame"
            >
                {{ state.gameEnded ? '再来一局' : '开始对局' }}
            </button>
        </header>

        <div class="game-board">
            <template v-for="z in playerZones" :key="z.zone">
                <div
                    class="game-seat"
                    :class="['game-seat--' + z.zone, { 'game-seat--active': state.currentActor === z.seat }]"
                    :aria-label="z.seat === state.myPlayerId ? '我的手牌' : '对手' + (z.seat + 1)"
                >
                    <div class="game-river">
                        <img
                            v-for="(tile, ti) in state.players[z.seat].discards"
                            :key="'r-' + ti"
                            :src="getPaiImage(tile, z.pose)"
                            class="game-tile game-tile--river"
                            alt=""
                        >
                    </div>
                    <div
                        class="game-hand"
                        :class="{
                            'game-hand--hidden': z.seat !== state.myPlayerId,
                            'game-hand--turn': z.seat === state.myPlayerId && isMyTurn
                        }"
                    >
                        <template v-if="z.seat !== state.myPlayerId">
                            <img
                                v-for="n in 13"
                                :key="'b-' + n"
                                :src="getPaiImage('?', z.pose)"
                                class="game-tile"
                                alt=""
                            >
                        </template>
                        <div v-if="state.players[z.seat].melds.length" class="game-melds">
                            <div v-for="(m, mi) in state.players[z.seat].melds" :key="'m-' + mi" class="game-meld">
                                <img
                                    v-for="t in m.consumed"
                                    :key="t"
                                    :src="getPaiImage(t, z.pose)"
                                    class="game-tile game-tile--meld"
                                    alt=""
                                >
                                <img
                                    v-if="m.type !== 'ankan'"
                                    :src="getPaiImage(m.pai, z.pose)"
                                    class="game-tile game-tile--meld game-tile--call"
                                    :class="{ 'game-tile--call-down': z.zone === 'bottom' }"
                                    alt=""
                                >
                            </div>
                        </div>
                        <template v-if="z.seat === state.myPlayerId">
                            <img
                                v-for="(tile, i) in state.players[z.seat].tehai"
                                :key="'h-' + i"
                                :src="getPaiImage(tile, z.pose)"
                                class="game-tile game-tile--mine"
                                role="button"
                                tabindex="0"
                                :aria-label="'出牌 ' + tile"
                                @click="handleTileClick(tile, i)"
                            >
                        </template>
                    </div>
                    <div class="game-player">
                        <span class="game-player__name">{{ state.players[z.seat].name }}</span>
                        <span class="game-player__score">{{ state.players[z.seat].score }}</span>
                        <div class="game-player__tags">
                            <span v-if="state.players[z.seat].dingQueSuit" class="game-tag game-tag--suit" :class="'game-tag--' + state.players[z.seat].dingQueSuit">
                                {{ suitName(state.players[z.seat].dingQueSuit) }}
                            </span>
                            <button
                                v-for="action in (z.seat === state.myPlayerId ? state.validActions : [])"
                                :key="action.label"
                                type="button"
                                class="game-tag game-tag--btn"
                                :class="action.class"
                                @click="sendAction(action)"
                            >
                                {{ action.label }}
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <div class="game-center">
                <div class="game-turn" :class="{ 'game-turn--on': isMyTurn }"></div>
                <span v-if="state.tilesLeft != null" class="game-left">剩 {{ state.tilesLeft }} 张</span>
            </div>
        </div>

        <div v-if="state.notification && !state.gameEnded" class="game-msg" role="alert">
            {{ state.notification }}
        </div>

        <div v-if="showResultPanel" class="game-over" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
            <div class="game-over__backdrop" @click.self="tryStartGame"></div>
            <div class="game-over__box">
                <h2 id="game-over-title" class="game-over__title">对局结束</h2>
                <ul class="game-over__list">
                    <li v-for="(p, i) in state.players" :key="i" class="game-over__row">
                        <span>{{ p.name }}</span>
                        <span>{{ p.score }} 分</span>
                    </li>
                </ul>
                <button type="button" class="game-cta game-over__again" @click="tryStartGame">再来一局</button>
            </div>
        </div>

        <pre v-if="state.debug" class="game-debug" aria-hidden="true">{{ state.status }} | {{ state.gameStarted }} | {{ state.connected }} | {{ state.isMyTurn }}</pre>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
