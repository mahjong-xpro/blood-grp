<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>血战到底</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="app">
    <div id="app" class="app-root" :class="{ 'app-root--over': state.gameEnded }">
        <header class="bar">
            <span class="bar-title">血战到底</span>
            <span class="bar-status" aria-live="polite">{{ state.status }}</span>
            <button v-if="!state.gameStarted || state.gameEnded" type="button" class="bar-btn" @click="tryStartGame">
                {{ state.gameEnded ? '再来一局' : '开始对局' }}
            </button>
        </header>

        <div class="table">
            <div class="table-inner">
                <template v-for="z in playerZones" :key="z.zone">
                    <div
                        :class="['side', 'side--' + z.zone, { 'side--turn': state.currentActor === z.seat }]"
                        :aria-label="z.seat === state.myPlayerId ? '我的手牌' : '对手' + (z.seat + 1)"
                    >
                        <div class="side-river">
                            <img
                                v-for="(tile, ti) in state.players[z.seat].discards"
                                :key="'d-' + ti"
                                :src="getPaiImage(tile, z.pose)"
                                class="tile tile--sm"
                                alt=""
                            >
                        </div>
                        <div
                            class="side-hand"
                            :class="{
                                'side-hand--opp': z.seat !== state.myPlayerId,
                                'side-hand--turn': z.seat === state.myPlayerId && isMyTurn
                            }"
                        >
                            <template v-if="z.seat !== state.myPlayerId">
                                <img v-for="n in 13" :key="'b-' + n" :src="getPaiImage('?', z.pose)" class="tile" alt="">
                            </template>
                            <template v-else>
                                <div v-if="state.players[z.seat].melds.length" class="side-melds">
                                    <div v-for="(m, mi) in state.players[z.seat].melds" :key="'g-' + mi" class="meld">
                                        <img v-for="t in m.consumed" :key="t" :src="getPaiImage(t, z.pose)" class="tile tile--sm" alt="">
                                        <img v-if="m.type !== 'ankan'" :src="getPaiImage(m.pai, z.pose)" class="tile tile--sm tile--call" alt="">
                                    </div>
                                </div>
                                <img
                                    v-for="(tile, i) in state.players[z.seat].tehai"
                                    :key="'h-' + i"
                                    :src="getPaiImage(tile, z.pose)"
                                    class="tile tile--mine"
                                    role="button"
                                    tabindex="0"
                                    :aria-label="'出牌 ' + tile"
                                    @click="handleTileClick(tile, i)"
                                >
                            </template>
                        </div>
                        <div class="side-info">
                            <span class="side-info-name">{{ state.players[z.seat].name }}</span>
                            <span class="side-info-score">{{ state.players[z.seat].score }}</span>
                            <span v-if="state.players[z.seat].dingQueSuit" class="side-info-dq" :class="'side-info-dq--' + state.players[z.seat].dingQueSuit">{{ suitName(state.players[z.seat].dingQueSuit) }}</span>
                        </div>
                    </div>
                </template>
                <div class="table-center">
                    <span v-if="state.tilesLeft != null" class="table-center-text">剩 {{ state.tilesLeft }} 张</span>
                </div>
            </div>
        </div>

        <div v-if="state.validActions.length > 0" class="actions" role="group" aria-label="可选操作">
            <button
                v-for="action in state.validActions"
                :key="action.label"
                type="button"
                class="actions-btn"
                :class="action.class"
                @click="sendAction(action)"
            >{{ action.label }}</button>
        </div>

        <div v-if="state.notification && !state.gameEnded" class="toast" role="alert">{{ state.notification }}</div>

        <div v-if="showResultPanel" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-backdrop" @click.self="tryStartGame"></div>
            <div class="modal-panel">
                <h2 id="modal-title" class="modal-title">对局结束</h2>
                <ul class="modal-list">
                    <li v-for="(p, i) in state.players" :key="i" class="modal-row"><span>{{ p.name }}</span><span>{{ p.score }} 分</span></li>
                </ul>
                <button type="button" class="bar-btn modal-btn" @click="tryStartGame">再来一局</button>
            </div>
        </div>

        <pre v-if="state.debug" class="debug" aria-hidden="true">{{ state.status }} {{ state.connected }} {{ state.isMyTurn }}</pre>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
