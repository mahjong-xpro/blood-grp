<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Blood Arena - Human vs AI (Modern)</title>
    <!-- Use legacy style for Dytem board rendering -->
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <!-- Overlay new modern style -->
    <link rel="stylesheet" type="text/css" href="/css/style_v2.css">

    <!-- Dependencies -->
    <script src="/js/jquery-1.7.2.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="/js/dytem.js"></script>

    <!-- Archive Player Logic (Modified environment) -->
    <script>
        var resourceDir = "static";
        // Suppress legacy auto-init if possible or let it run harmlessly 
        // (It runs on document ready, we just need to ensure DOM exists)
    </script>
    <script src="/js/archive_player.js"></script>
</head>

<body>

    <div id="app">
        <!-- HUD Layer: Sitting on top -->
        <div class="hud-layer">

            <!-- Top Bar: Status & Scores -->
            <div class="status-bar">
                <span>{{ status }}</span>
            </div>

            <div class="score-board">
                <div v-for="(score, idx) in scores" :key="idx" class="score-row"
                    :class="{ 'active': currentActor === idx }">
                    <span class="score-name">Player {{ idx }}</span>
                    <span class="score-val">{{ score }}</span>
                </div>
            </div>

            <!-- Center Notification (e.g. "Rhong!", "Tsumo!") -->
            <div class="center-notify" :class="{ 'active': notification }">
                {{ notification }}
            </div>

            <!-- Controls (Bottom) -->
            <div class="controls-container">
                <template v-if="validActions.length > 0">
                    <button v-for="action in validActions" :key="action.label" class="btn-action" :class="action.class"
                        @click="handleAction(action.payload)">
                        {{ action.label }}
                    </button>
                </template>
                <div v-else style="min-height: 50px;"></div>
            </div>
        </div>

        <!-- Board Container: Static for Dytem -->
        <!-- v-once ensures Vue never updates this DOM after initial render -->
        <!-- Dytem expects this EXACT structure -->
        <div id="board-container" v-once>
            <div class="board">
                <div id="players" class="repeated player">
                    <div class="ho">
                        <div id="players.hoRows" class="repeated pai-row">
                            <img id="players.hoRows.pais" class="repeated">
                        </div>
                    </div>
                    <div class="tehai-container pai-row">
                        <img id="players.tehais" class="repeated">
                        <img id="players.tsumoPai" class="tsumo-pai">
                    </div>
                    <div class="furo-container pai-row">
                        <span id="players.furos" class="repeated">
                            <img id="players.furos.pais" class="repeated">
                        </span>
                    </div>
                    <div class="player-footer"></div>
                </div>
                <div class="wanpais-container">
                    <img id="wanpais" class="repeated">
                </div>
            </div>

            <!-- Legacy Controller Elements (Required by archive_player.js selectors) -->
            <!-- We hide them but keep them in DOM to prevent JS errors -->
            <div class="controller-container" style="display:none;">
                <select id="kyokuSelector"></select>
                <button id="prev-button"></button>
                <button id="next-button"></button>
                <button id="viewpoint-button"></button>
                <div id="playerInfos" class="repeated">
                    <div id="playerInfos.index"></div>
                    <div id="playerInfos.name"></div>
                    <div id="playerInfos.score"></div>
                    <div id="playerInfos.viewpoint"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Game Logic (Vue App) -->
    <script src="/js/game_v2.js"></script>

</body>

</html>
