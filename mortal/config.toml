# Training Configuration
# 服务器路径配置：
# - 数据目录: /data/mortal
# - 源码目录: /data/blood

[control]
version = 4
online = true

# 模型文件路径
state_file = '/data/mortal/mortal.pth'
best_state_file = '/data/mortal/best.pth'
tensorboard_dir = '/data/mortal/logs'

# 计算设备配置
#
# 单机 8×4090 推荐用法（online 模式）：
# - 训练器（trainer）进程：CUDA_VISIBLE_DEVICES=0 -> 这里保持 cuda:0
# - 每个客户端（client）进程：CUDA_VISIBLE_DEVICES=<物理卡号> -> 这里同样保持 cuda:0
#   （因为每个进程只“看见”自己那 1 张卡）
device = 'cuda:0'
enable_cudnn_benchmark = true  # GPU 训练时建议启用
enable_amp = true  # 混合精度训练，节省显存
enable_compile = false  # PyTorch 2.0+ 编译优化（可选）

# 训练参数
# 4090 (24GB) 单卡训练建议从 2048 起步，视显存/吞吐可尝试 3072/4096。
# 该项目当前 trainer 是“单进程单 GPU”，8 卡的主要收益来自多 client 并发自对局产数。
batch_size = 4096
opt_step_every = 1

# 保存和测试频率
save_every = 1000 # 2000 Samples/Step * 1000 Steps = 2M Samples (约3-5分钟存一次)
test_every = 5000   # 5000 Steps = 10M Samples (约15-25分钟测一次，监控恢复进度)
submit_every = 1000

# 自对局配置（用于生成训练数据）
# 使用环境变量 TRAIN_PLAY_PROFILE 可以选择不同的配置
[train_play.default]
# 8×4090（7 个 client 并发）建议降低单个 client 的 games，
# 以更快拉取新参数、提高整体迭代速度；总吞吐由 client 数量补回来。
games = 6400
log_dir = '/data/mortal/train_play'  # 自对局数据保存目录
boltzmann_epsilon = 0.15  # 探索率 (后期: 0.05 - Step 400k+ 降低探索)
                     # 阶段建议:
                     # 1. 初期: 0.5
                     # 2. 中期: 0.15
                     # 3. 后期: 0.05 (当前)

boltzmann_temp = 0.2    # 温度参数 (后期: 0.1 - Step 400k+ 降低探索)
                     # 阶段建议:
                     # 1. 初期: 0.5
                     # 2. 中期: 0.2
                     # 3. 后期: 0.1 (当前)
top_p = 1.0
repeats = 1
keep_data = false

# 测试对局配置
[test_play]
games = 3000
log_dir = '/data/mortal/test_play'

# 数据集配置
# 自博弈训练：指向自对局生成的数据目录
[dataset]
globs = ['/data/mortal/train_play/**/*.json.gz']
file_index = '/data/mortal/file_index.pth'
file_batch_size = 32
reserve_ratio = 0.0
# num_workers 与 CPU/存储强相关；8×GPU 通常配更强 CPU，可先从 8 试起。
num_workers = 8
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

# 环境配置
[env]
gamma = 0.995  # 折扣因子 (激进调整: 0.95, 强迫 AI 重视眼前收益，拒绝并在)
pts = [6.0, 4.0, 2.0, 0.0]

# ResNet 模型配置
[resnet]
conv_channels = 192
num_blocks = 40

# CQL (Conservative Q-Learning) 配置
[cql]
min_q_weight = 0.0
                     # CQL 权重 (压制未见动作的力度)
                     # 阶段建议:
                     # 1. Zero Start: 0.0 (关闭 CQL，鼓励自由探索，避免初期过度悲观)
                     # 2. 稳定期: 0.5-1.0 (防止 Q 值发散)

# 辅助任务配置
[aux]
next_rank_weight = 0.25  # 排名预测任务的权重 (略升以强化排名学习，test_play avg_pt 略低于随机)
# 定缺辅助：仅在定缺步加即时奖励塑形，帮助学习定缺选择（见 docs/DING_QUE_AUXILIARY_LEARNING.md）
ding_que_aux_enabled = true
ding_que_aux_scale = 0.02  # ding_que_quality in [-1,1]，不宜过大
# 定缺 CE 监督：仅在定缺步用启发式「最佳花色」做交叉熵损失（方案 B）
ding_que_ce_weight = 0.2

# Batch Normalization 冻结配置
[freeze_bn]
# 在线训练时设置为 true
mortal = false

# 优化器配置
[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 1.0  # 启用梯度裁剪 (1.0)，防止无 CQL 时梯度主要爆炸

# 学习率调度器配置
[optim.scheduler]
peak = 1e-4   # 峰值学习率
final = 5e-5  # 最终学习率 (启用 decay，dqn_loss 在 50k+ 缓慢上升时利于稳定)
warm_up_steps = 1000  # 预热步数 (防止梯度爆炸)
max_steps = 1000000  # 设置为较大的值以支持长时间训练 (需 > warm_up_steps)

# Baseline 模型配置（用于自对局）
# 第一次训练时，如果 baseline 文件不存在，系统会使用当前模型作为 baseline
[baseline.train]
device = 'cuda:0'  # 或 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'  # 如果不存在，会使用当前模型

[baseline.test]
device = 'cuda:0'  # 或 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

# 在线训练配置（分布式训练）
[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/data/mortal/buffer'
drain_dir = '/data/mortal/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
# 多 client 并发提交日志时，capacity 太小会频繁出现 "samples overflow"。
# 7 个 client 并发建议 >= 20000；磁盘够的话可更大。
capacity = 40000
force_sequential = false

# 1v3 测试配置（用于评估模型）
[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '/data/mortal/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/data/mortal/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/data/mortal/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false  # 是否使用 Akochan AI 作为对手
dir = '/path/to/akochan'  # Akochan 目录（如果启用）
tactics = '/path/to/tactics.json'  # Akochan 策略文件（如果启用）

