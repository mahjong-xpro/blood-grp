# 🚀 Fresh Start Training Configuration
# 新服务器 4090×8 优化配置
# 阶段 1: 初期探索期 (Step 0 - 100k)

[control]
version = 4
online = true

# 模型文件路径
state_file = '/data/mortal/mortal.pth'
best_state_file = '/data/mortal/best.pth'
tensorboard_dir = '/data/mortal/logs'

# 计算设备配置 (4090 x 8)
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = false
enable_compile = false

# 训练参数 - 4090 单卡 24GB 可用 4096
batch_size = 4096
opt_step_every = 1

# 保存和测试频率
save_every = 1000
test_every = 5000
submit_every = 1000

# ═══════════════════════════════════════════════════════
# 阶段 2 配置: 防守与收敛 (Step 70k - 200k)
# 降低探索，开启排名奖励，学习防守
# ═══════════════════════════════════════════════════════

[train_play.default]
games = 6400
log_dir = '/data/mortal/train_play'

# 探索参数 - Phase 2: 降低探索，减少噪声数据
boltzmann_epsilon = 0.15  # 阶段 2: 0.30 → 0.15
boltzmann_temp = 0.20     # 阶段 2: 0.30 → 0.20

# 阶段转换指南 (V2):
# ┌──────────────────────────────────────────────────────┐
# │ 阶段             │ epsilon │ temp  │ Step 范围       │
# ├──────────────────────────────────────────────────────┤
# │ 1. 基础探索 [完成] │  0.30   │ 0.30  │ 0 - 70k        │
# │ 2. 防守与收敛      │  0.15   │ 0.20  │ 70k - 200k     │
# │ 3. 进攻/防守平衡   │  0.08   │ 0.15  │ 200k - 500k    │
# │ 4. 精细优化        │  0.05   │ 0.10  │ 500k - 1M      │
# │ 5. 超人类          │  0.03   │ 0.08  │ 1M+            │
# └──────────────────────────────────────────────────────┘

top_p = 1.0
repeats = 1
keep_data = false

# 测试对局配置
# TRAIN-03 fix: 3000→10000 (实际 2500 局，avg_rank 标准差 ~0.02-0.035)
[test_play]
games = 10000
log_dir = '/data/mortal/test_play'

# 数据集配置
[dataset]
globs = ['/data/mortal/train_play/**/*.json.gz']
file_index = '/data/mortal/file_index.pth'
file_batch_size = 32
reserve_ratio = 0.0
num_workers = 8  # 4090x8 服务器 CPU 通常较强
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

# 环境配置
[env]
gamma = 0.99  # 阶段 1: 高 gamma，学习长期规划 (后期降到 0.98)
# 排名 PT 计分 (血战麻将)
# 1位=4pt, 2位=2pt, 3位=1pt, 4位=0pt
# 用于 avg_pt 指标计算，不影响训练奖励
pts = [4.0, 2.0, 1.0, 0.0]

# TD(λ) 配置
# BUG-06 fix: 当前无 V(s') bootstrap, λ<1 会使有效折扣从 γ 退化为 γ×λ.
# 必须设 λ=1.0 使 TD(λ) ≡ MC. 待引入 target network 提供 V(s') 后可降回 0.95.
td_lambda = 1.0
td_lambda_enabled = true # 启用 TD(λ) 回报计算路径 (λ=1.0 时等价于 MC)

# 奖励塑形配置
[reward_shaping]
# Phase 2: 开启排名奖励，学习防守与风险规避
rank_bonus_enabled = true     # Phase 2 关键变更: false → true
rank_bonuses = [0.3, 0.1, -0.1, -0.3]

# 动作级奖励 (和牌/放铳)
action_bonus_enabled = true
agari_bonus = 0.1            # 和牌奖励
houjuu_penalty = -0.1        # 放铳惩罚

# 自动更新 baseline 的阈值 (阶梯式训练)
# 当 avg_pt 超过此值时，自动用当前模型替换 baseline
baseline_update_threshold = 3.2

# 阶段转换指南 (V2):
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ 阶段             │ rank_bonus │ agari  │ houjuu │ BL更新间隔            │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ 1. 基础探索 [完成] │  false     │  0.1   │ -0.1   │ ~15-20k              │
# │ 2. 防守与收敛      │  true      │  0.1   │ -0.1   │ 30k                  │
# │ 3. 进攻/防守平衡   │  true      │  0.05  │ -0.05  │ 40-50k               │
# │ 4. 精细优化        │  true      │  0.02  │ -0.02  │ 50-80k               │
# │ 5. 超人类          │  false     │  0     │  0     │ 100k                 │
# └──────────────────────────────────────────────────────────────────────────┘

# 规则配置
[rules]
# 训练时是否随机化 FanConfig (每局独立随机开关各番种)
# true = 多规则训练 (模型学习条件化策略)
# false = 仅标准规则 (所有番种启用) — 从零训练建议先关闭
randomize_fan_config = false

# ResNet 模型配置
# MODEL-05 fix: SuitAwareConv1d 将有效宽度从 27 缩至 9 (单花色)，
# 4 层 conv 即覆盖全花色，更深层仅做 channel mixing。
[resnet]
conv_channels = 192
num_blocks = 30

# CQL 配置 - online 模式下不生效，但保留配置
[cql]
min_q_weight = 0.0  # 阶段 1: 关闭 CQL，鼓励自由探索

# 辅助任务配置
[aux]
next_rank_weight = 0.25

# 定缺辅助
ding_que_aux_enabled = true
ding_que_aux_scale = 0.02

# 定缺 CE 监督 - AuxNet 分类头 (主)
ding_que_ce_weight = 2.0  # Phase 2: 1.0 → 2.0, 强化定缺监督
# 定缺 CE 监督 - DQN Q 值弱 CE (辅), 让 DQN 直接获得定缺方向信号
ding_que_dqn_ce_weight = 0.1  # 弱权重, 避免与 Bellman 目标梯度冲突

# 对手等待预测: 预测 3 个对手的听牌 (81 = 3×27)
opp_wait_enabled = true   # 开启对手听牌预测辅助任务
opp_wait_weight = 0.1     # BCE 损失权重

# Batch Normalization 冻结配置
[freeze_bn]
mortal = false

# 优化器配置
[optim]
eps = 1e-8
betas = [0.9, 0.999]
# TRAIN-01 fix: 0.1 对 30 层 192ch ResNet 过度正则化，降为 0.01。
weight_decay = 0.01
max_grad_norm = 1.0

# 学习率调度器配置
[optim.scheduler]
peak = 5e-4   # 阶段 1: 高学习率加速初期学习
final = 1e-4  # 最终稳定在 1e-4
warm_up_steps = 2000
max_steps = 1000000

# Baseline 模型配置
[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

# 在线训练配置
[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/data/mortal/buffer'
drain_dir = '/data/mortal/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 40000  # 7 个 client 并发足够
force_sequential = false

# 1v3 测试配置
[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '/data/mortal/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/data/mortal/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/data/mortal/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'
