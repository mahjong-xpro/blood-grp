# 🚀 Fresh Start Training Configuration
# 新服务器 4090×8 优化配置
# 阶段 2: 策略成型期 (Step 85k+)

[control]
version = 4
online = true

# 模型文件路径
state_file = '/data/mortal/mortal.pth'
best_state_file = '/data/mortal/best.pth'
tensorboard_dir = '/data/mortal/logs'

# 计算设备配置 (4090 x 8)
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = false

# 训练参数 - 4090 单卡 24GB 可用 4096
batch_size = 4096
opt_step_every = 1

# 保存和测试频率
save_every = 1000
test_every = 5000
submit_every = 1000

# ═══════════════════════════════════════════════════════
# 阶段 2 配置: 策略成型 (Step 85k - 300k)
# 降低探索，启用排名奖励，强化定缺监督
# ═══════════════════════════════════════════════════════

[train_play.default]
games = 6400
log_dir = '/data/mortal/train_play'

# 探索参数 - 阶段 2: 深度收敛 (Step 200k - 300k)
boltzmann_epsilon = 0.15  # 保持中等探索，寻求更深层的收敛
boltzmann_temp = 0.2      # 阶段 2: 中等温度

# 阶段转换指南:
# ┌──────────────────────────────────────────────────────┐
# │ 阶段       │ epsilon │ temp  │ 触发条件            │
# ├──────────────────────────────────────────────────────┤
# │ 1. 探索期  │  0.3    │ 0.3   │ Step 0 - 100k       │
# │ 2. 收敛期  │  0.15   │ 0.2   │ Step 100k - 300k    │
# │ 3. 精调期  │  0.05   │ 0.1   │ Step 300k+          │
# └──────────────────────────────────────────────────────┘

top_p = 1.0
repeats = 1
keep_data = false

# 测试对局配置
[test_play]
games = 3000
log_dir = '/data/mortal/test_play'

# 数据集配置
[dataset]
globs = ['/data/mortal/train_play/**/*.json.gz']
file_index = '/data/mortal/file_index.pth'
file_batch_size = 32
reserve_ratio = 0.0
num_workers = 8  # 4090x8 服务器 CPU 通常较强
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

# 环境配置
[env]
gamma = 0.99  # 阶段 1: 高 gamma，学习长期规划 (后期降到 0.98)
# 排名 PT 计分 (血战麻将)
# 1位=4pt, 2位=2pt, 3位=1pt, 4位=0pt
# 用于 avg_pt 指标计算，不影响训练奖励
pts = [4.0, 2.0, 1.0, 0.0]

# TD(λ) 配置
td_lambda = 0.95         # λ 参数: 0=TD(0), 1=MC, 0.95=推荐值
td_lambda_enabled = true # 启用 TD(λ) 训练 (替代纯 Monte Carlo)

# 奖励塑形配置
[reward_shaping]
# 阶段 2: 启用排名奖励，激励争夺名次
rank_bonus_enabled = true
rank_bonuses = [0.3, 0.1, -0.1, -0.3]

# 动作级奖励 (和牌/放铳) - 阶段 2 开启
action_bonus_enabled = true  # 启用动作奖励
agari_bonus = 0.1            # 和牌奖励
houjuu_penalty = -0.1        # 放铳惩罚

# 自动更新 baseline 的阈值 (阶梯式训练)
# 当 avg_pt 超过此值时，自动用当前模型替换 baseline
baseline_update_threshold = 3.2

# 阶段转换指南:
# ┌──────────────────────────────────────────────────────┐
# │ 阶段       │ rank_bonus │ 触发条件                  │
# ├──────────────────────────────────────────────────────┤
# │ 1. 探索期  │  false     │ Step 0 - 100k             │
# │ 2. 收敛期  │  true      │ Step 100k+ (avg_pt > 2.8) │
# └──────────────────────────────────────────────────────┘

# ResNet 模型配置 - 增大模型容量
[resnet]
conv_channels = 256  # 从 192 增加，更强的表示能力
num_blocks = 50      # 从 40 增加，更深的网络

# CQL 配置 - online 模式下不生效，但保留配置
[cql]
min_q_weight = 0.0  # 阶段 1: 关闭 CQL，鼓励自由探索

# 辅助任务配置
[aux]
next_rank_weight = 0.25

# 定缺辅助
ding_que_aux_enabled = true
ding_que_aux_scale = 0.02

# 定缺 CE 监督 - 阶段 2 增强监督
ding_que_ce_weight = 5  # 阶段 2+: 强力定缺监督 (用户要求提高匹配率)

# 对手等待预测: 预测 3 个对手的听牌 (81 = 3×27)
opp_wait_enabled = false  # 需要 libblood 重新编译后启用
opp_wait_weight = 0.1     # BCE 损失权重

# Batch Normalization 冻结配置
[freeze_bn]
mortal = false

# 优化器配置
[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 1.0

# 学习率调度器配置
[optim.scheduler]
peak = 5e-4   # 阶段 1: 高学习率加速初期学习
final = 1e-4  # 最终稳定在 1e-4
warm_up_steps = 2000
max_steps = 1000000

# Baseline 模型配置
[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

# 在线训练配置
[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/data/mortal/buffer'
drain_dir = '/data/mortal/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 40000  # 7 个 client 并发足够
force_sequential = false

# 1v3 测试配置
[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '/data/mortal/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/data/mortal/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/data/mortal/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'
