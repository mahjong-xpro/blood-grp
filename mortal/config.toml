# 🚀 Fresh Start Training Configuration
# 新服务器 4090×8 优化配置
# 阶段 1: 初期探索期 (Step 0 - 100k)

[control]
version = 4
online = true

# 模型文件路径
state_file = '/data/mortal/mortal.pth'
best_state_file = '/data/mortal/best.pth'
tensorboard_dir = '/data/mortal/logs'

# 计算设备配置 (4090 x 8)
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = false
enable_compile = false

# 训练参数
batch_size = 2048  # Phase 6c: Oracle 新增 2 个模型，4096 会 OOM
opt_step_every = 1

# 保存和测试频率
save_every = 1000
test_every = 5000
submit_every = 1000

# ═══════════════════════════════════════════════════════
# Phase 5 配置: 梯度净化 (回滚自 Phase 6 死亡螺旋)
# Phase 6 (706-715k) 同时启用 TN+Oracle+TD(λ=0.95) 导致灾难性崩溃
# 回滚至 705k Phase 5 稳态，后续采用渐进式激活策略
# ═══════════════════════════════════════════════════════

[train_play.default]
games = 6400
log_dir = '/data/mortal/train_play'

# 探索参数 - Phase 4: 精细优化
boltzmann_epsilon = 0.05  # Phase 4: 0.06 → 0.05 (485k)
boltzmann_temp = 0.10     # Phase 4: 0.12 → 0.10 (485k)

# 阶段转换指南 (V2):
# ┌──────────────────────────────────────────────────────┐
# │ 阶段             │ epsilon │ temp  │ Step 范围       │
# ├──────────────────────────────────────────────────────┤
# │ 1. 基础探索 [完成] │  0.30   │ 0.30  │ 0 - 70k        │
# │ 2. 防守与收敛[完成]│  0.15   │ 0.20  │ 70k - 355k     │
# │ 3a.进攻/防守[完成] │  0.08   │ 0.15  │ 355k - 420k    │
# │ 3b.减弱惩罚[完成]  │  0.06   │ 0.12  │ 420k - 485k    │
# │ 4. 纯博弈 [完成]    │  0.05   │ 0.10  │ 485k - 580k    │
# │ 5. 梯度净化 [完成]  │  0.05   │ 0.10  │ 580k - 700k    │
# │ 6. TN+Oracle [回滚] │  0.05   │ 0.10  │ 706-715k 已回滚│
# └──────────────────────────────────────────────────────┘

top_p = 1.0
repeats = 1
keep_data = false

# 测试对局配置
# TRAIN-03 fix: 3000→10000 (实际 2500 局，avg_rank 标准差 ~0.02-0.035)
[test_play]
games = 10000
log_dir = '/data/mortal/test_play'

# 数据集配置
[dataset]
globs = ['/data/mortal/train_play/**/*.json.gz']
file_index = '/data/mortal/file_index.pth'
file_batch_size = 32
reserve_ratio = 0.0
num_workers = 8  # 4090x8 服务器 CPU 通常较强
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

# 环境配置
[env]
gamma = 0.99  # 阶段 1: 高 gamma，学习长期规划 (后期降到 0.98)
# 排名 PT 计分 (血战麻将)
# 1位=4pt, 2位=2pt, 3位=1pt, 4位=0pt
# 用于 avg_pt 指标计算，不影响训练奖励
pts = [4.0, 2.0, 1.0, 0.0]

# TD(λ) 配置
# 历史: λ=1.0 (Phase 1-5) → 0.99 (6a, 705-737k) → 0.98 (6b-1, 737-753k)
# 现在 td_lambda 控制 MC/1-step-TD 混合比: λ=1.0→纯MC, λ=0→纯1-step-TD
# Phase 6b-2: A1+A3 目标值到位
td_lambda = 0.95
td_lambda_enabled = true

# 奖励塑形配置
[reward_shaping]
# Phase 4 (485k): 关闭所有奖励塑形，纯 score_diff 驱动
# 历史: -0.2(249k) → -0.1(355k) → -0.05(420k) → 0(485k)
# 防守已内化到权重中 (放铳率从 45% 降至 34%)，不再需要额外惩罚信号
rank_bonus_enabled = false
rank_bonuses = [0.3, 0.1, -0.1, -0.3]

# 动作级奖励: 全部关闭
action_bonus_enabled = false  # true → false (485k, Phase 4): 关闭所有 action bonus
agari_bonus = 0.0
houjuu_penalty = 0.0          # -0.05 → 0 (485k, Phase 4): 完全关闭

# 自动更新 baseline 的阈值 (阶梯式训练)
# 当 avg_pt 超过此值时，自动用当前模型替换 baseline
baseline_update_threshold = 3.2

# 阶段转换指南 (V3):
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ 阶段             │ rank_bonus │ agari  │ houjuu │ BL策略                │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ 1. 基础探索 [完成] │  false     │  0.1   │ -0.1   │ 手动 15-20k          │
# │ 2. 防守与收敛[完成]│  false     │  0.0   │ -0.2   │ 对手池 20k           │
# │ 3a.进攻/防守[完成] │  false     │  0.0   │ -0.1   │ 对手池 20-30k        │
# │ 3b.减弱惩罚[完成]  │  false     │  0.0   │ -0.05  │ 对手池 30k           │
# │ 4. 纯博弈 [完成]    │  false     │  0     │  0     │ 对手池 30-50k        │
# │ 5. 梯度净化 [完成]  │  false     │  0     │  0     │ 对手池 + 净化梯度    │
# │ 6. TN+Oracle [回滚] │  false     │  0     │  0     │ 回滚: 706-715k      │
# └──────────────────────────────────────────────────────────────────────────┘

# 规则配置
[rules]
# 训练时是否随机化 FanConfig (每局独立随机开关各番种)
# true = 多规则训练 (模型学习条件化策略)
# false = 仅标准规则 (所有番种启用) — 从零训练建议先关闭
randomize_fan_config = false

# ResNet 模型配置
# MODEL-05 fix: SuitAwareConv1d 将有效宽度从 27 缩至 9 (单花色)，
# 4 层 conv 即覆盖全花色，更深层仅做 channel mixing。
[resnet]
conv_channels = 192
num_blocks = 30

# CQL 配置 - online 模式下不生效，但保留配置
[cql]
min_q_weight = 0.0  # 阶段 1: 关闭 CQL，鼓励自由探索

# 辅助任务配置
[aux]
# Phase 5 (580k): 关闭 next_rank，血战到底单局结算无需跨局排名预测
# 审计发现 next_rank_loss×0.25 占总梯度 54.5%，严重干扰 RL 学习
next_rank_weight = 0.0    # 0.25 → 0 (580k, Phase 5)

# 定缺辅助: 关闭 Q-target 上的隐藏奖励塑形
# Phase 4 声称"纯 score_diff"，但 ding_que_bonus (±0.02) 仍在修改 Q-target
ding_que_aux_enabled = false  # true → false (580k, Phase 5)
ding_que_aux_scale = 0.02

# 定缺 CE 监督 - AuxNet 分类头 (主)
# 定缺已收敛 (CE=0.003)，降低权重减少对 Brain 的梯度干扰
ding_que_ce_weight = 1.0  # 2.0 → 1.0 (580k, Phase 5)
# 定缺 CE 监督 - DQN Q 值 CE: 抵抗蒸馏梯度对定缺 Q 值的冲突
# 历史: 0 → 0.01 (659k 防漂移) → 0.1 (773k 对抗 distill 梯度)
# 773k 时 distill_weight=0.1 使蒸馏梯度比 CE 强 350x，定缺 Q 值被 Oracle 拉偏
ding_que_dqn_ce_weight = 0.1  # 0.01 → 0.1 (773k): 对抗蒸馏梯度冲突

# 对手等待预测: 预测 3 个对手的听牌 (81 = 3×27)
opp_wait_enabled = true   # 开启对手听牌预测辅助任务
opp_wait_weight = 0.1     # BCE 损失权重

# Target Network 配置
# 延迟更新的 Brain+DQN 副本，提供稳定的 V(s') 估计
# 启用后 Q-target 从 MC 回报切换为 1-step TD:
#   q_target = r_imm + γ * V_target(s') * (1-done)
# Phase 6 (706-715k) 同时启用导致死亡螺旋，已回滚
# Phase 6a 计划: 单独启用 + td_lambda=0.99 渐进过渡
[target_network]
enabled = true            # Phase 6a: 单独启用 (td_lambda=0.99 渐进过渡)
tau = 0.005               # 软更新系数: θ_target ← τ*θ + (1-τ)*θ_target
update_every = 1          # 每 N 个 optimizer step 执行一次软更新

# Oracle Guiding 配置 — 完美信息教师指导
# Oracle 模型看到所有玩家手牌+牌墙（完美信息），学习理论最优策略
# 通过 KL 散度蒸馏将 Oracle 策略传授给 Student（不完美信息）
# Phase 6c-2a: 开始向 Student 蒸馏 (distill=0.1)
# 历史: 0.0 (6c-1, 763-770k Oracle 自学) → 0.1 → 0.3 → 0.5
[oracle]
enabled = true            # Phase 6c-1 起启用
num_blocks = 15           # Oracle Brain 块数（完美信息任务更简单，比 Student 的 30 少）
conv_channels = 192       # Oracle Brain 通道数
distill_weight = 0.1      # Phase 6c-2a: 轻量蒸馏开始
distill_temperature = 1.0 # softmax 温度（越高分布越平滑，越低越尖锐）
oracle_dqn_weight = 1.0   # Oracle 自身 DQN 损失权重

# Batch Normalization 冻结配置
[freeze_bn]
mortal = false

# 优化器配置
[optim]
eps = 1e-8
betas = [0.9, 0.999]
# TRAIN-01 fix: 0.1 对 30 层 192ch ResNet 过度正则化，降为 0.01。
weight_decay = 0.01
max_grad_norm = 1.0

# 学习率调度器配置
[optim.scheduler]
peak = 3e-4   # 阶段 3: 5e-4 → 3e-4 (355k)，精细调整
final = 5e-5  # 阶段 3: 1e-4 → 5e-5，降低最终 LR
warm_up_steps = 3000  # 阶段 3: 2000 → 3000，平滑过渡
max_steps = 1000000

# Baseline 模型配置
[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

# V3: 对手池配置 (参考 OpenAI Five 80/20 策略)
# 维护 5-8 个历史检查点，每次自博弈随机选取一个作为 baseline
# 打破单一 baseline 过拟合，创造对手多样性
[baseline.pool]
enabled = true
pool_dir = '/data/mortal/baseline_pool'
reload_every = 1        # 每 N 次 train_play 迭代重选 baseline
newest_weight = 3.0     # 最新检查点的采样权重（其他为 1.0）

# 在线训练配置
[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/data/mortal/buffer'
drain_dir = '/data/mortal/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 40000  # 7 个 client 并发足够
force_sequential = false

# 1v3 测试配置
[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '/data/mortal/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/data/mortal/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/data/mortal/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'
