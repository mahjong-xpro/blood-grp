# 🚀 Fresh Start Training Configuration
# 新服务器 4090×8 优化配置
# 阶段 2: 策略成型期 (Step 85k+)

[control]
version = 4
online = true

# 模型文件路径
state_file = '/data/mortal/mortal.pth'
best_state_file = '/data/mortal/best.pth'
tensorboard_dir = '/data/mortal/logs'

# 计算设备配置 (4090 x 8)
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = false
enable_compile = false

# 训练参数 - 4090 单卡 24GB, AMP 关闭后 float32 显存翻倍
batch_size = 2048
opt_step_every = 2  # 梯度累积 2 步，等效 batch_size=4096

# 保存和测试频率
save_every = 1000
test_every = 3000      # Phase 7C: 更频繁监控 (5000 -> 3000)
submit_every = 1000

# ═══════════════════════════════════════════════════════
# Phase 7C 配置: 极轻量护栏 (Step 875k+)
# 最小剂量奖励塑形 + LR 重启，保留大牌追求天花板
# ═══════════════════════════════════════════════════════

[train_play.default]
games = 6400
log_dir = '/data/mortal/train_play'

# 探索参数 - Phase 7C: 微增探索，帮助脱离 Phase 6 局部最优
boltzmann_epsilon = 0.08  # Phase 7C: 0.05 -> 0.08 (微增探索)
boltzmann_temp = 0.18     # Phase 7C: 0.15 -> 0.18 (略微平滑策略分布)

# Agari 探索增强: 在 Ron 决策点 (mask[29] AND mask[30]) 以此概率探索 Ron
# 解决探索死锁: 模型 Q 函数偏移后不选 Ron → 无 Ron 样本 → 无法纠正 → 恶性循环
# 设为 0.25 = 25% 的 Ron 机会会被探索，足以产生训练信号
# 非强制: 标记为 non-greedy，Q 函数修正后自然收敛，此机制逐渐失效
agari_explore_eps = 0.25

# 阶段转换指南:
# ┌──────────────────────────────────────────────────────┐
# │ 阶段       │ epsilon │ temp  │ 触发条件            │
# ├──────────────────────────────────────────────────────┤
# │ 1. 探索期  │  0.3    │ 0.3   │ Step 0 - 100k       │
# │ 2. 收敛期  │  0.15   │ 0.2   │ Step 100k - 300k    │
# │ 3. 精调期  │  0.05   │ 0.1   │ Step 300k - 470k    │
# │ 3.5 激进期 │  0.25   │ 0.4   │ Step 470k+          │
# │ 5. 精调收敛│  0.08   │ 0.15  │ Step 650k+          │
# │ 6. 纯粹贪婪│  0.05   │ 0.15  │ Step 738k - 875k    │
# │ 7C 极轻护栏│  0.08   │ 0.18  │ Step 875k+          │
# └──────────────────────────────────────────────────────┘

top_p = 1.0
repeats = 1
keep_data = false

# 测试对局配置
[test_play]
games = 5000 
log_dir = '/data/mortal/test_play'

# 数据集配置
[dataset]
globs = ['/data/mortal/train_play/**/*.json.gz']
file_index = '/data/mortal/file_index.pth'
file_batch_size = 32
reserve_ratio = 0.0
num_workers = 8  # 4090x8 服务器 CPU 通常较强
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

# 环境配置
[env]
gamma = 0.99  # 阶段 1: 高 gamma，学习长期规划 (后期降到 0.98)
# 排名 PT 计分 (血战麻将)
# 1位=4pt, 2位=2pt, 3位=1pt, 4位=0pt
# 用于 avg_pt 指标计算，不影响训练奖励
pts = [4.0, 2.0, 1.0, 0.0]

# TD(λ) 配置
td_lambda = 0.95         # λ 参数: 0=TD(0), 1=MC, 0.95=推荐值
td_lambda_enabled = true # 启用 TD(λ) 训练 (替代纯 Monte Carlo)

# 奖励塑形配置
[reward_shaping]
# Phase 7C: 极轻量护栏 — 仅防止策略崩溃，不主导学习方向
# 设计原则: 对 3番以上手牌偏差 < 4%，保留 Phase 6 大牌追求天花板
rank_bonus_enabled = true
rank_bonuses = [0.0, 0.0, 0.0, -0.15]  # 只惩罚 4th (解决 29.2% 问题)，不奖励 1st

# 动作级奖励 (极小剂量)
action_bonus_enabled = true
agari_bonus = 0.05           # 极小: 1番荣和 0.10→0.15 (+50%), 3番自摸 1.20→1.25 (+4%)
houjuu_penalty = -0.05       # 极小: 仅提醒"放铳是坏事"，不强制防守

# 自动更新 baseline 的阈值 (阶梯式训练)
# 禁用自动更新 (已知 Bug: 自博弈 client 不会 reload)
# 手动操作: cp mortal.pth baseline.pth + 重启 client
baseline_update_threshold = 4.0

# ResNet 模型配置 - 增大模型容量
[resnet]
conv_channels = 256  # 从 192 增加，更强的表示能力
num_blocks = 50      # 从 40 增加，更深的网络

# CQL 配置 - online 模式下不生效，但保留配置
[cql]
min_q_weight = 0.0  # 阶段 1: 关闭 CQL，鼓励自由探索

# 辅助任务配置
[aux]
next_rank_weight = 0.25

# 定缺辅助
ding_que_aux_enabled = true
ding_que_aux_scale = 0.02

# 定缺 CE 监督 - 阶段 2 增强监督
ding_que_ce_weight = 0.5  # 阶段 2+: 紧急回调 (避免过拟合定缺辅助)

# 对手等待预测: 预测 3 个对手的听牌 (81 = 3×27)
opp_wait_enabled = true   # Phase 6: 开启对手听牌预测 (Opponent Modeling)
opp_wait_weight = 0.1     # BCE 损失权重

# Batch Normalization 冻结配置
[freeze_bn]
mortal = false

# 优化器配置
[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 1.0

# 学习率调度器配置 — Phase 7C: LR 重启 (Cosine Restart)
[optim.scheduler]
peak = 2e-4       # Phase 7C: 重启 LR (当前 6.8e-5 → warmup 到 2e-4)
                   # 低于初始 5e-4 (模型已成熟), 高于当前 (需要学习新策略)
final = 1e-5      # Phase 7C: 更低终点，实现超精细收敛
warm_up_steps = 5000   # Phase 7C: 5k 步 warmup，避免 LR 跳变引起灾变
max_steps = 1350000    # Phase 7C: 延长到 1.35M (从 875k 再跑 475k 步)

# Baseline 模型配置
[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

# 在线训练配置
[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/data/mortal/buffer'
drain_dir = '/data/mortal/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 40000  # 7 个 client 并发足够
force_sequential = false

# 1v3 测试配置
[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '/data/mortal/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/data/mortal/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/data/mortal/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'
