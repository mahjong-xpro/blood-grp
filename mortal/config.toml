# Training Configuration
# 服务器路径配置：
# - 数据目录: /data/mortal
# - 源码目录: /data/blood

[control]
version = 4
online = true

# 模型文件路径
state_file = '/data/mortal/mortal.pth'
best_state_file = '/data/mortal/best.pth'
tensorboard_dir = '/data/mortal/logs'

# 计算设备配置
device = 'cuda:0'  # 如果有 GPU，否则改为 'cuda:0'
enable_cudnn_benchmark = true  # GPU 训练时建议启用
enable_amp = true  # 混合精度训练，节省显存
enable_compile = true  # PyTorch 2.0+ Compile Optimization: Free Speedup for 4090

# 训练参数
batch_size = 4096  # RTX 4090 Cluster Optimization: Saturate Trainer GPU
opt_step_every = 1

# 保存和测试频率
save_every = 2000 # 2000 Steps checkpoint = Safe
test_every = 50000   # 50000 Steps = ~200M Samples. 降低测试频率，让集群专注跑分 (约1.5小时测一次)
submit_every = 1000 # 关键修正: Cluster模式下，生成速度极快。必须高频(1000步)同步模型，否则 Client 总是用旧模型跑数据(Off-Policy Lag)

# 自对局配置（用于生成训练数据）
# 使用环境变量 TRAIN_PLAY_PROFILE 可以选择不同的配置
[train_play.default]
games = 12800  # RTX 4090 Cluster: Increase batch to reduce upload frequency
log_dir = '/data/mortal/train_play'  # 自对局数据保存目录
boltzmann_epsilon = 0.5  # 探索率 (初期: 0.5 - 用户指示重回 Zero Start)
                     # 阶段建议:
                     # 1. 初期: 0.5 (当前)
                     # 2. 中期: 0.15
                     # 3. 后期: 0.005

boltzmann_temp = 0.5     # 温度参数 (初期: 0.5)
                     # 阶段建议:
                     # 1. 初期: 0.5 (当前)
                     # 2. 中期: 0.2
                     # 3. 后期: 0.05
top_p = 1.0
repeats = 1
keep_data = false

# 测试对局配置
[test_play]
games = 3000
log_dir = '/data/mortal/test_play'

# 数据集配置
# 自博弈训练：指向自对局生成的数据目录
[dataset]
globs = ['/data/mortal/train_play/**/*.json.gz']
file_index = '/data/mortal/file_index.pth'
file_batch_size = 20
reserve_ratio = 0.0
num_workers = 6  # EPYC 7542 (64 Cores/Node): 8 Cores/GPU -> Safe to use 6 workers
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

# 环境配置
[env]
gamma = 0.95  # 折扣因子 (激进调整: 0.95, 强迫 AI 重视眼前收益，拒绝并在)
pts = [6.0, 4.0, 2.0, 0.0]

# ResNet 模型配置
[resnet]
conv_channels = 192
num_blocks = 40

# CQL (Conservative Q-Learning) 配置
[cql]
min_q_weight = 0.0
                     # CQL 权重 (压制未见动作的力度)
                     # 阶段建议:
                     # 1. Zero Start: 0.0 (关闭 CQL，鼓励自由探索，避免初期过度悲观)
                     # 2. 稳定期: 0.5-1.0 (防止 Q 值发散)

# 辅助任务配置
[aux]
next_rank_weight = 0.2  # 排名预测任务的权重

# Batch Normalization 冻结配置
[freeze_bn]
# 在线训练时设置为 true
mortal = false

# 优化器配置
[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 1.0  # 启用梯度裁剪 (1.0)，防止无 CQL 时梯度主要爆炸

# 学习率调度器配置
[optim.scheduler]
peak = 1e-4  # 峰值学习率
final = 1e-4  # 最终学习率
warm_up_steps = 1000  # 预热步数 (防止梯度爆炸)
max_steps = 1000000  # 设置为较大的值以支持长时间训练 (需 > warm_up_steps)

# Baseline 模型配置（用于自对局）
# 第一次训练时，如果 baseline 文件不存在，系统会使用当前模型作为 baseline
[baseline.train]
device = 'cuda:0'  # 或 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'  # 如果不存在，会使用当前模型

[baseline.test]
device = 'cuda:0'  # 或 'cuda:0'
enable_compile = false
state_file = '/data/mortal/baseline.pth'

# 在线训练配置（分布式训练）
[online]
history_window = 50
enable_compile = false

[online.remote]
host = '0.0.0.0'
port = 5000

[online.server]
buffer_dir = '/data/mortal/buffer'
drain_dir = '/data/mortal/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1000  # Capacity Fix: Limit buffer to forces freshness. Prevent data staling.
force_sequential = false

# 1v3 测试配置（用于评估模型）
[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '/data/mortal/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/data/mortal/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/data/mortal/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false  # 是否使用 Akochan AI 作为对手
dir = '/path/to/akochan'  # Akochan 目录（如果启用）
tactics = '/path/to/tactics.json'  # Akochan 策略文件（如果启用）

