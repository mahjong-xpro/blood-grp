[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "blood"
version = "2.0.0"
description = "Superhuman Bloody Battle Mahjong AI"
requires-python = ">=3.10"
dependencies = [
    "sample-factory>=2.0.1,<2.0.2",
    "gymnasium>=0.29",
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.maturin]
manifest-path = "crates/pybind/Cargo.toml"
python-source = "python"
module-name = "blood._engine"
features = ["pyo3/extension-module"]
