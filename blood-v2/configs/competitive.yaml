# ⚠️ Architecture params (blood_num_tile_attn_layers, oracle_num_tile_attn_layers,
#    rnn_num_layers) MUST be identical across ALL training stages.
#    Changing them between stages will cause checkpoint weight shape mismatches.

# Phase 2a: Competitive — self-play + oracle value head training
# Duration: ~1M env steps
# Goal: train oracle value head to convergence (blood/oracle_value_head_loss < 0.1)
# Prerequisite: resume from warmup checkpoint (or hotfixed competitive checkpoint)
# Next: switch to competitive_distill.yaml (Phase 2b) once oracle_value_head_loss converges

# Sample Factory
num_workers: 16
num_envs_per_worker: 16
batch_size: 1024
num_batches_per_epoch: 8
ppo_clip_ratio: 0.1
max_grad_norm: 1.0
gamma: 0.998
gae_lambda: 0.95
learning_rate: 1e-4
lr_schedule: kl_adaptive_minibatch
lr_schedule_kl_threshold: 0.001   # Fix 3: recalibrated for masked action space (was SF2 default 0.008)
lr_adaptive_max: 3e-4              # Fix 3: hard LR ceiling (was SF2 default 0.01)
lr_adaptive_min: 2e-5              # Fix: 从 1e-6 提升到 2e-5，防止 LR 降到接近零
exploration_loss_coeff: 0.01           # 与 linear 调度起始值一致
value_loss_coeff: 1.0
train_for_env_steps: 1000000

# Environment
initial_score: 100000
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_competitive

# Model — 与 warmup.yaml/default.yaml 保持一致 (256ch/20blocks Bottleneck)
# 修复: 原 192ch/30blocks 为 V1 规格，无法加载 warmup 阶段的 256ch/20blocks 权重
# 修复: blood_obs_channels 384 → 473 (Rust NUM_STUDENT_CHANNELS=473, +3 genbutsu)
blood_obs_channels: 473
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024
blood_enc_proj_layers: 3               # SpatialPoolingProj: 与所有阶段保持一致
blood_num_tile_attn_layers: 4
blood_tile_attn_heads: 4

# Opponents: neural self-play via league
opponent_mode: selfplay
opponent_refresh_every: 20

# Oracle distillation
# oracle_distill_weight: 0.01 — reduced while oracle policy head warms up
# oracle_ce_weight: 0.05 — reduced to limit random oracle influence early
# oracle_value_distill_weight: 0.0 — DISABLED in Phase 2a; oracle value head must
#   converge first (blood/oracle_value_head_loss < 0.1). Enable in Phase 2b.
# oracle_value_head_loss_weight: 1.0 — supervised MSE loss trains oracle value head
# oracle_value_warmup_steps: not used (distill_weight=0.0 means gate never fires)
oracle_enabled: true
oracle_num_blocks: 10
oracle_num_tile_attn_layers: 2
oracle_tile_attn_heads: 4
oracle_distill_weight: 0.01
oracle_distill_temperature: 2.0
oracle_ce_weight: 0.05
oracle_value_distill_weight: 0.0
oracle_value_head_loss_weight: 1.0
oracle_value_warmup_steps: 0           # Fix R10-M9: explicit (default 500k would silently gate if distill enabled)

# Arena evaluation — periodic strength measurement via RuleBot games
# Updates Elo ratings during training so TensorBoard shows real progress
blood_arena_eval_every: 100000         # evaluate every 100k steps (competitive is 1M total)
blood_arena_eval_games: 50             # 50 games per eval (fast, ~30s on CPU)
blood_arena_eval_temperature: 0.1

# League — frequent checkpointing for diverse opponent pool
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 50000
league_newest_weight: 2.0              # 与 default.yaml/cfg.py 保持一致
league_uniform_floor: 0.1
league_self_play_prob: 0.2             # 20% 概率使用当前策略自博弈
league_frozen_window: 3                # 最近3个checkpoint不参与采样
league_max_pool_size: 200              # 扩容覆盖更长训练历史
save_every_sec: 30

# No reward shaping — pure score-based reward
warmup_reward_shaping: false

# Data augmentation
suit_augment_prob: 0.5

# Structured reward shaping — score-weighted: intensity=clamp(sqrt(|delta|/32000), 0.25, 1.0)
reward_tsumo_bonus: 0.1             # score-weighted: 1番自摸→0.031, 6番自摸→0.100
reward_deal_in_penalty: 0.05        # score-weighted: 1番放铳→0.014, 6番放铳→0.050
reward_shanten_progress: 0.003
reward_shanten_regress: 0.001

# 向听番数加权 — competitive 阶段轻微引导，开始学习番数意识
shanten_fan_bonus_scale: 0.15
shanten_fan_max: 8.0

# 排名奖励 — 血战麻将的核心目标是排名而非单局得分
# 鼓励模型学习全局排名策略（如：领先时保守、落后时激进）
reward_rank_bonus: 0.15             # score-weighted: effective ∈ [0.04, 0.15]

# 安全弃牌奖励 — 补充防守信号，鼓励安全打牌
# 仅靠 deal_in_penalty 不足以学会主动防守，需要正向激励安全弃牌
reward_safe_discard: 0.015          # score-weighted shaping 会自动调节实际影响

# Auxiliary tasks — standard weight
aux_shanten_weight: 1.0
aux_opp_waits_weight: 0.3

# LSTM — temporal modeling across turns
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 2
rollout: 32
recurrence: 32

# Advantage clipping — Fix 5: tightened from 5.0 to 2.0
# Corrupted critic can produce extreme advantages; tighter clip prevents runaway gradients
adv_clip: 2.0

# Dynamic hyperparameter schedules (within this stage)
# Entropy: linear warmup from 0.01 → 0.05 over first 500k steps
blood_schedule_entropy: "linear,0.01,0.05,0,500000"
