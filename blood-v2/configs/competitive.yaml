# Phase 2a: Competitive — self-play + oracle value head training
# Duration: ~1M env steps
# Goal: train oracle value head to convergence (blood/oracle_value_head_loss < 0.1)
# Prerequisite: resume from warmup checkpoint (or hotfixed competitive checkpoint)
# Next: switch to competitive_distill.yaml (Phase 2b) once oracle_value_head_loss converges

# Sample Factory
num_workers: 16
num_envs_per_worker: 32
batch_size: 2048
num_batches_per_epoch: 8
ppo_clip_ratio: 0.1
max_grad_norm: 1.0
gamma: 0.998
gae_lambda: 0.95
learning_rate: 1e-4
lr_schedule: kl_adaptive_minibatch
lr_schedule_kl_threshold: 0.001   # Fix 3: recalibrated for masked action space (was SF2 default 0.008)
lr_adaptive_max: 3e-4              # Fix 3: hard LR ceiling (was SF2 default 0.01)
lr_adaptive_min: 1e-6              # explicit (same as SF2 default)
exploration_loss_coeff: 0.05       # Fix 5: increased from 0.02 to fight degenerate fixed point
value_loss_coeff: 1.0
train_for_env_steps: 1000000

# Environment
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_competitive

# Model — 与 warmup.yaml/default.yaml 保持一致 (256ch/20blocks Bottleneck)
# 修复: 原 192ch/30blocks 为 V1 规格，无法加载 warmup 阶段的 256ch/20blocks 权重
# 修复: blood_obs_channels 384 → 464 (Rust NUM_STUDENT_CHANNELS=464)
blood_obs_channels: 464
blood_conv_channels: 256
blood_num_res_blocks: 16
blood_encoder_out_dim: 1024

# Opponents: neural self-play via league
opponent_mode: selfplay
opponent_refresh_every: 20

# Oracle distillation
# Fix 4: oracle_distill_weight reduced (0.03→0.01) while oracle policy head warms up
# Fix 4: oracle_ce_weight reduced (default 0.1→0.05) to limit random oracle influence early
# Fix 1: oracle_value_distill_weight=0.0 — oracle value head has no training signal until
#         oracle_value_head_loss trains it; re-enable after oracle_value_head_loss converges
# Fix 1: oracle_value_head_loss_weight=1.0 — supervised loss to train oracle value head
# Fix 1: oracle_value_warmup_steps=500000 — gate: value distillation only after 500K steps
oracle_enabled: true
oracle_num_blocks: 20
oracle_distill_weight: 0.01
oracle_distill_temperature: 2.0
oracle_ce_weight: 0.05
oracle_value_distill_weight: 0.0
oracle_value_head_loss_weight: 1.0
oracle_value_warmup_steps: 500000

# League — frequent checkpointing for diverse opponent pool
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 50000
league_newest_weight: 3.0
save_every_sec: 30

# No reward shaping — pure score-based reward
warmup_reward_shaping: false

# Data augmentation
suit_augment_prob: 0.5

# Structured reward shaping (REWARD_NORM=32000: 6-fan cap; tsumo max=+1.732, ron max=+1.0 sqrt-compressed)
reward_tsumo_bonus: 0.1
reward_deal_in_penalty: 0.05
reward_shanten_progress: 0.003
reward_shanten_regress: 0.001

# Auxiliary tasks — standard weight
aux_shanten_weight: 1.0
aux_opp_waits_weight: 0.3

# LSTM — temporal modeling across turns
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 1
rollout: 32
recurrence: 32

# Advantage clipping — Fix 5: tightened from 5.0 to 2.0
# Corrupted critic can produce extreme advantages; tighter clip prevents runaway gradients
adv_clip: 2.0
