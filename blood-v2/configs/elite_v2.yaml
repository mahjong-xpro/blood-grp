# ⚠️ Architecture params (blood_num_tile_attn_layers, oracle_num_tile_attn_layers,
#    rnn_num_layers) MUST be identical across ALL training stages.
#    Changing them between stages will cause checkpoint weight shape mismatches.

# Phase 3: Elite — 精英微调
# Duration: ~100M env steps
# Goal: 策略精炼、超人类水平
# Opponents: 联赛自博弈（更大池）
# Oracle: 低权重蒸馏 + RTPA + ISMCE
# TurnAttention: 启用

# --- 硬件 ---
num_workers: 32
num_envs_per_worker: 16
batch_size: 4096
num_batches_per_epoch: 8

# --- PPO ---
ppo_clip_ratio: 0.1                # 最保守，精细微调
max_grad_norm: 2.0
gamma: 0.999                       # 最长视野
gae_lambda: 0.97
learning_rate: 5e-5
lr_schedule: kl_adaptive_minibatch
lr_schedule_kl_threshold: 0.002
lr_adaptive_max: 1e-4
lr_adaptive_min: 2e-5
exploration_loss_coeff: 0.015      # 初始中等探索
value_loss_coeff: 0.5
train_for_env_steps: 100000000

# --- Environment ---
initial_score: 100000
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_elite_v2

# --- Model (与所有阶段保持一致: 256ch/20blocks Bottleneck, obs=473) ---
blood_obs_channels: 473
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024
blood_enc_proj_layers: 3               # SpatialPoolingProj: 注意力池化保留牌位结构
blood_num_tile_attn_layers: 4
blood_tile_attn_heads: 4

# --- 对手 ---
opponent_mode: selfplay
opponent_refresh_every: 10

# --- Oracle（低权重维持） ---
oracle_enabled: true
oracle_num_blocks: 10
oracle_num_tile_attn_layers: 2
oracle_tile_attn_heads: 4
oracle_distill_weight: 0.01
oracle_distill_temperature: 1.5
oracle_ce_weight: 0.02
oracle_value_distill_weight: 0.03
oracle_value_head_loss_weight: 0.3

# --- 奖励塑形 ---
warmup_reward_shaping: false
reward_tsumo_bonus: 0.2
reward_deal_in_penalty: 0.1
reward_shanten_progress: 0.003         # 降低，模型已成熟
reward_shanten_regress: 0.001
shanten_fan_bonus_scale: 0.3
shanten_fan_max: 8.0
shanten_reward_decay_steps: 60000000   # 前 60M 步衰减
shanten_reward_min_ratio: 0.2
reward_rank_bonus: 0.3
reward_safe_discard: 0.005

# --- 辅助任务（降低权重） ---
aux_shanten_weight: 0.5
aux_opp_waits_weight: 0.2

# --- LSTM + TurnAttention ---
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 2
rollout: 32
recurrence: 32
turn_attention_enabled: true
turn_attention_heads: 4

# --- 联赛 ---
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 50000
league_self_play_prob: 0.1
league_frozen_window: 5
league_max_pool_size: 300

# --- 评估 ---
blood_arena_eval_every: 1000000
blood_arena_eval_games: 500            # 500 局，Elo 置信区间 ±1.5%
blood_arena_eval_temperature: 0.1

# --- 定缺 ---
dingque_prior_enabled: true
dingque_prior_warmup_steps: 100000
oracle_dingque_uniform: true
dingque_reward_shaping: false

# --- 对手手牌预测 ---
opponent_predictor_enabled: true
opponent_predictor_weight: 0.05

# --- RTPA + ISMCE ---
rtpa_enabled: true
rtpa_attack_temp: 0.8
rtpa_defend_temp: 1.5
ismce_enabled: true
ismce_num_worlds: 96
ismce_rollout_depth: 8

# --- 动态调度 ---
blood_schedule_entropy: "cosine,0.015,0.008,0,100000000"
blood_schedule_adv_clip: "linear,3.0,2.0,0,50000000"
blood_entropy_floor: 0.008

# --- 优势裁剪 ---
adv_clip: 3.0

# --- 数据增强 ---
suit_augment_prob: 0.5

# --- 性能 ---
use_mixed_precision: true
save_every_sec: 300
