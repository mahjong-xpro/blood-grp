# ⚠️ Architecture params (blood_num_tile_attn_layers, oracle_num_tile_attn_layers,
#    rnn_num_layers) MUST be identical across ALL training stages.
#    Changing them between stages will cause checkpoint weight shape mismatches.

# Phase 1: Warmup — learn basic mahjong from RuleBot opponents
# Duration: ~2M env steps
# Goal: learn dingque, basic discard, simple winning patterns

# Sample Factory
num_workers: 16
num_envs_per_worker: 16
batch_size: 2048
num_batches_per_epoch: 4
ppo_clip_ratio: 0.2
max_grad_norm: 1.0
gamma: 0.99
gae_lambda: 0.95
learning_rate: 3e-4                    # Fix R10-H6: was 5e-4 > lr_adaptive_max, immediately clamped
lr_schedule: kl_adaptive_minibatch
lr_schedule_kl_threshold: 0.004        # Fix R10-L7: explicit (SF2 default 0.008 too permissive)
lr_adaptive_max: 3e-4              # Fix: 限制 LR 上限，防止 KL 极低时 LR 攀升到 0.01
lr_adaptive_min: 1e-4              # Fix R10-L6: prevent LR collapse (SF2 default 1e-6)
exploration_loss_coeff: 0.01
value_loss_coeff: 1.0
train_for_env_steps: 2000000
save_every_sec: 30                 # Fix R12-M11: frequent saves for league snapshots and crash recovery

# Environment
initial_score: 100000
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_warmup

# Model — 与 default.yaml/competitive.yaml 保持一致 (256ch/20blocks Bottleneck)
# 修复: 原 192ch/30blocks 为 V1 规格，warmup 权重无法迁移到后续阶段
# 修复: blood_obs_channels 384 → 473 (Rust NUM_STUDENT_CHANNELS=473, +3 genbutsu)
blood_obs_channels: 473
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024
blood_enc_proj_layers: 3               # SpatialPoolingProj: 注意力池化保留牌位结构
blood_num_tile_attn_layers: 4
blood_tile_attn_heads: 4

# Opponents: RuleBot during warmup
opponent_mode: rulebot

# Oracle distillation — policy distillation enabled from the start
# oracle_value_distill_weight: 0.0 — disabled; oracle value head trains here as a head start
# oracle_value_head_loss_weight: 1.0 — oracle value head trains on GAE returns during warmup
# oracle_value_warmup_steps: 0 — no gate needed (distill_weight=0.0 means it never fires)
oracle_enabled: true
oracle_num_blocks: 20
oracle_num_tile_attn_layers: 4
oracle_tile_attn_heads: 4
oracle_distill_weight: 0.1
oracle_distill_temperature: 3.0
oracle_ce_weight: 0.05                  # Oracle CE loss weight (same as competitive)
oracle_value_distill_weight: 0.0
oracle_value_head_loss_weight: 1.0
oracle_value_warmup_steps: 0

# Arena evaluation — periodic strength measurement via RuleBot games
# Updates Elo ratings during training so TensorBoard shows real progress
blood_arena_eval_every: 200000         # evaluate every 200k steps (warmup is 2M total)
blood_arena_eval_games: 50             # 50 games per eval (fast, ~30s on CPU)
blood_arena_eval_temperature: 0.1

# League — collect snapshots but don't use them yet
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 100000
league_newest_weight: 2.0              # 与 default.yaml/cfg.py 保持一致
league_uniform_floor: 0.1
league_self_play_prob: 0.0             # warmup 阶段不自博弈（对手是 RuleBot）

# Reward shaping — extra signals to accelerate early learning
warmup_reward_shaping: true
warmup_dq_bonus: 0.05
warmup_win_bonus: 0.1
warmup_dangerous_discard_penalty: 0.03

# Data augmentation — full strength
suit_augment_prob: 0.5

# Structured reward shaping — score-weighted (competitive 阶段启用后生效)
reward_tsumo_bonus: 0.0             # warmup 阶段禁用 (warmup_reward_shaping 覆盖)
reward_deal_in_penalty: 0.0         # warmup 阶段禁用
reward_shanten_progress: 0.003
reward_shanten_regress: 0.001

# 向听番数加权 — warmup 阶段禁用，先学基础向听进退
shanten_fan_bonus_scale: 0.0

# Auxiliary tasks — higher weight during warmup for faster shanten learning
aux_shanten_weight: 2.0
aux_opp_waits_weight: 0.6

# LSTM — enabled during warmup to ensure checkpoint architecture matches all stages.
# Although RuleBot opponents have fixed patterns, enabling LSTM here means:
#   1. Checkpoint weights (including LSTM) transfer cleanly to warmup_transition
#   2. Head dimensions (actor/critic/aux) match across all phases (rnn_size=512)
#   3. warmup_transition can fine-tune existing LSTM weights instead of random init
# The warmup_transition phase further adapts LSTM for temporal modeling before
# switching to self-play in the competitive phase.
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 2
rollout: 32
recurrence: 32
