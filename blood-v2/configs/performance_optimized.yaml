# Performance-Optimized Configuration
# 
# This config enables all performance optimizations while maintaining
# model architecture and training quality:
# - Parallel mode (10-15x speedup)
# - Mixed precision training (1.5-2x speedup)
# - Optimized batch size and checkpoint frequency
#
# Expected total speedup: 15-30x
# Training time: 10.6 days → 8-20 hours

# Inherit from default
num_workers: 16
num_envs_per_worker: 16
batch_size: 4096  # Increased from 2048 (better GPU utilization)
num_batches_per_epoch: 4
ppo_clip_ratio: 0.1
max_grad_norm: 1.0
gamma: 0.998
gae_lambda: 0.95
learning_rate: 3e-4
lr_schedule: kl_adaptive_minibatch
exploration_loss_coeff: 0.01
value_loss_coeff: 1.0
train_for_env_steps: 2000000

# Performance optimizations
use_mixed_precision: true  # FP16 training (1.5-2x speedup on GPU)
compile_model: false  # torch.compile (experimental, may cause issues)

# Reduce I/O overhead
save_every_sec: 300  # Save every 5 minutes (was 30 seconds)
blood_arena_eval_every: 500000  # Evaluate every 500K steps (was 200K)

# Environment
initial_score: 100000
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_perf_optimized

# Model (same as default - NO changes to architecture)
blood_obs_channels: 473
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024
blood_enc_proj_layers: 3
blood_num_tile_attn_layers: 4
blood_tile_attn_heads: 4

# Oracle (same as default)
oracle_enabled: true
oracle_num_blocks: 20
oracle_num_tile_attn_layers: 4
oracle_tile_attn_heads: 4
oracle_distill_weight: 0.1
oracle_distill_temperature: 3.0
oracle_ce_weight: 0.05
oracle_value_distill_weight: 0.5
oracle_value_head_loss_weight: 1.0
oracle_value_warmup_steps: 0

# Arena evaluation
blood_arena_eval_games: 50
blood_arena_eval_temperature: 0.1

# League
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 100000
league_newest_weight: 2.0
league_uniform_floor: 0.1
league_self_play_prob: 0.2
league_frozen_window: 3
league_max_pool_size: 200
opponent_mode: rulebot
opponent_refresh_every: 20

# Data augmentation
suit_augment_prob: 0.5

# Structured reward shaping
reward_tsumo_bonus: 0.1
reward_deal_in_penalty: 0.05
reward_shanten_progress: 0.003
reward_shanten_regress: 0.001
shanten_fan_bonus_scale: 0.3
shanten_fan_max: 8.0
reward_rank_bonus: 0.0
reward_safe_discard: 0.0

# Warmup塑形 (disabled for this phase)
warmup_reward_shaping: false

# Auxiliary tasks
aux_shanten_weight: 2.0
aux_opp_waits_weight: 0.6

# LSTM
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 2
rollout: 32
recurrence: 32