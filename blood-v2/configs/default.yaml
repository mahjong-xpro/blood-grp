# ⚠️ Architecture params (blood_num_tile_attn_layers, oracle_num_tile_attn_layers,
#    rnn_num_layers) MUST be identical across ALL training stages.
#    Changing them between stages will cause checkpoint weight shape mismatches.

# Blood-v2 Production Hyperparameters
# Single unified configuration for superhuman-level training
# Use phase-specific yamls (warmup/competitive/elite) for curriculum training

# Sample Factory
num_workers: 8
num_envs_per_worker: 16
batch_size: 2048
num_batches_per_epoch: 4
ppo_clip_ratio: 0.1
max_grad_norm: 1.0
gamma: 0.998
gae_lambda: 0.95
learning_rate: 3e-4
lr_schedule: kl_adaptive_minibatch
exploration_loss_coeff: 0.005
value_loss_coeff: 1.0
train_for_env_steps: 5000000

# Environment
initial_score: 100000
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2

# Model — 与 Rust consts.rs 保持一致 (NUM_STUDENT_CHANNELS=473, +3 genbutsu, Bottleneck 256ch/20blocks)
blood_obs_channels: 473
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024
blood_enc_proj_layers: 3               # SpatialPoolingProj: 注意力池化保留牌位结构
blood_num_tile_attn_layers: 4
blood_tile_attn_heads: 4

# Oracle
oracle_enabled: true
# 修复: 从 20 改为 10，teacher 看完美信息不需要与 student 同等容量\noracle_num_blocks: 10
oracle_num_tile_attn_layers: 2
oracle_tile_attn_heads: 4
oracle_distill_weight: 0.05
oracle_distill_temperature: 2.0

# Arena evaluation — periodic strength measurement via RuleBot games
blood_arena_eval_every: 100000         # evaluate every 100k steps
blood_arena_eval_games: 50
blood_arena_eval_temperature: 0.1

# League — 多项式衰减 α=2.0 + uniform_floor 保底，提高有效多样性
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 50000
league_newest_weight: 2.0              # 从 3.0 降到 2.0，提高有效多样性（与 cfg.py 默认值一致）
league_uniform_floor: 0.1              # 最低采样概率下限，确保旧 checkpoint 也能被采样
league_self_play_prob: 0.2             # 20% 概率使用当前策略自博弈
league_frozen_window: 3                # 最近3个checkpoint不参与采样
league_max_pool_size: 200              # 联赛池容量
opponent_mode: selfplay
opponent_refresh_every: 20

# Data augmentation
suit_augment_prob: 0.5

# Structured reward shaping — score-weighted: intensity=clamp(sqrt(|Δ|/32000), 0.25, 1.0)
reward_tsumo_bonus: 0.1             # score-weighted: 1番自摸→0.031, 6番自摸→0.100
reward_deal_in_penalty: 0.05        # score-weighted: 1番放铳→0.014, 6番放铳→0.050
reward_shanten_progress: 0.003
reward_shanten_regress: 0.001

# 向听番数加权 — 默认启用完整引导
shanten_fan_bonus_scale: 0.3
shanten_fan_max: 8.0

# 排名奖励 — score-weighted: 根据最终排名 × sqrt(|Δscore|/32000) 给予额外奖励
# 默认关闭(0.0)，在 competitive 及后续阶段启用
reward_rank_bonus: 0.0

# 安全弃牌奖励 — 对安全弃牌行为给予正向激励
# 默认关闭(0.0)，在 competitive 及后续阶段启用
reward_safe_discard: 0.0

# Auxiliary tasks
aux_shanten_weight: 1.0
aux_opp_waits_weight: 0.3

# DingQue system — progressive prior + Oracle uniformization
dingque_prior_enabled: true           # Enable progressive prior mechanism
dingque_prior_warmup_steps: 100000    # Prior decays from 1.0 to 0.0 over 100K steps
oracle_dingque_uniform: true          # Force Oracle to output uniform distribution during DingQue
dingque_reward_shaping: false         # Reward shaping based on hand structure (disabled by default)

# LSTM — temporal modeling across turns
# rnn_size=512 across all stages (warmup/competitive/elite).
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 2
rollout: 32
recurrence: 32
