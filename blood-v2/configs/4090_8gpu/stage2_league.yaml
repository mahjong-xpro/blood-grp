# Stage 2: Competitive League — neural self-play
# Hardware: 1x server, 8x RTX 4090
# Duration: ~20M env steps
# Prerequisite: resume from stage1 checkpoint
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 \
#   python -m blood.training.runner --cfg configs/4090_8gpu/stage2_league.yaml \
#     --load_checkpoint_kind best

# Parallelism
num_workers: 128
num_envs_per_worker: 32
policy_workers_per_policy: 2
batch_size: 65536
num_batches_per_epoch: 4
async_rl: true

# Environment
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_stage2

# Model — same as stage1 for weight transfer
blood_obs_channels: 384
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024

# LSTM — enabled from stage 2 (neural opponents have temporal patterns)
use_rnn: true
rnn_type: lstm
rnn_size: 1024
rnn_num_layers: 1
rollout: 32
recurrence: 32

# Opponents: neural self-play via league
opponent_mode: selfplay
opponent_refresh_every: 20

# Oracle distillation — reduced weight as student improves
oracle_enabled: true
oracle_num_blocks: 25
oracle_distill_weight: 0.03
oracle_distill_temperature: 2.0
oracle_ce_weight: 0.1
oracle_value_distill_weight: 0.5

# League — frequent checkpointing for diverse opponent pool
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 50000
league_newest_weight: 3.0

# No reward shaping — pure score-based reward
warmup_reward_shaping: false

# Data augmentation
suit_augment_prob: 0.5

# Structured reward shaping (REWARD_NORM=32000 with sqrt compression)
reward_tsumo_bonus: 0.1
reward_deal_in_penalty: 0.05
reward_shanten_progress: 0.003
reward_shanten_regress: 0.001
reward_safe_discard: 0.002
reward_rank_bonus: 0.3

# Auxiliary tasks
aux_shanten_weight: 1.0
aux_opp_waits_weight: 0.3

# PPO
learning_rate: 3e-4
lr_schedule: kl_adaptive_minibatch
ppo_clip_ratio: 0.1
max_grad_norm: 1.0
gamma: 0.998
gae_lambda: 0.95
exploration_loss_coeff: 0.01
value_loss_coeff: 1.0
train_for_env_steps: 20000000

# Input normalization
normalize_input: true
normalize_input_keys: ["obs", "oracle_obs"]
