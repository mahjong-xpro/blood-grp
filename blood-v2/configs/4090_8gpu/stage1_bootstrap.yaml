# Stage 1: Warmup — RuleBot opponents, oracle bootstrapping
# Hardware: 1x server, 8x RTX 4090
# Duration: ~5M env steps
#
# SF2 multi-GPU model (single process, NOT DDP):
#   - 1 Learner on GPU 0 (policy_id=0 → cuda:0)
#   - policy_workers_per_policy=2: 2 inference workers on GPU 1, GPU 2
#   - num_workers=128: 128 CPU rollout workers
#   - Total throughput: ~200K steps/hour on 8x4090
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 \
#   python -m blood.training.runner --cfg configs/4090_8gpu/stage1_bootstrap.yaml

# Parallelism
num_workers: 128
num_envs_per_worker: 32
policy_workers_per_policy: 2
batch_size: 65536
num_batches_per_epoch: 4
async_rl: true

# Environment
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_stage1

# Model — 256ch/20blocks Bottleneck, enc_proj 12528→1024
blood_obs_channels: 464
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024

# LSTM — disabled in stage 1 (RuleBot opponents have fixed patterns)
use_rnn: false

# Opponents: RuleBot during bootstrapping
opponent_mode: rulebot

# Oracle distillation — strong teacher signal in stage 1
oracle_enabled: true
oracle_num_blocks: 25
oracle_distill_weight: 0.1
oracle_distill_temperature: 3.0
oracle_ce_weight: 0.1
oracle_value_distill_weight: 0.5

# League — collect snapshots but don't use them yet
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 100000
league_newest_weight: 3.0

# Reward shaping — accelerate early learning
warmup_reward_shaping: true
warmup_dq_bonus: 0.05
warmup_win_bonus: 0.1
warmup_dangerous_discard_penalty: 0.03

# Data augmentation
suit_augment_prob: 0.5

# Auxiliary tasks — higher weight during bootstrapping
aux_shanten_weight: 2.0
aux_opp_waits_weight: 0.6

# PPO
learning_rate: 5e-4
lr_schedule: kl_adaptive_minibatch
ppo_clip_ratio: 0.2
max_grad_norm: 1.0
gamma: 0.99
gae_lambda: 0.95
exploration_loss_coeff: 0.01
value_loss_coeff: 1.0
train_for_env_steps: 5000000

# Input normalization
normalize_input: true
normalize_input_keys: ["obs", "oracle_obs"]
