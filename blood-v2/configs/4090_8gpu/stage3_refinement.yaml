# Stage 3: Elite Refinement — superhuman fine-tuning
# Hardware: 1x server, 8x RTX 4090
# Duration: ~50M+ env steps
# Prerequisite: resume from stage2 checkpoint
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 \
#   python -m blood.training.runner --cfg configs/4090_8gpu/stage3_refinement.yaml \
#     --load_checkpoint_kind best

# Parallelism
num_workers: 128
num_envs_per_worker: 32
policy_workers_per_policy: 2
batch_size: 65536
num_batches_per_epoch: 8
async_rl: true

# Environment
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_stage3

# Model — same as stage1/2 for weight transfer
blood_obs_channels: 384
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024

# LSTM
use_rnn: true
rnn_type: lstm
rnn_size: 1024
rnn_num_layers: 1
rollout: 32
recurrence: 32

# Opponents: neural self-play via league
opponent_mode: selfplay
opponent_refresh_every: 10

# Oracle distillation — minimal weight; student should surpass oracle
oracle_enabled: true
oracle_num_blocks: 25
oracle_distill_weight: 0.01
oracle_distill_temperature: 1.5
oracle_ce_weight: 0.05
oracle_value_distill_weight: 0.2

# League — very frequent snapshots for fine-grained progression
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 25000
league_newest_weight: 3.0

# No reward shaping
warmup_reward_shaping: false

# Data augmentation
suit_augment_prob: 0.5

# Structured reward shaping — stage 3 approaches pure score-based training.
# Shanten progress disabled: mature model should not need proxy signals.
# Rank bonus reduced: avoid over-penalizing risk-taking that could win 1st.
reward_tsumo_bonus: 0.05
reward_deal_in_penalty: 0.03
reward_shanten_progress: 0.0
reward_shanten_regress: 0.0
reward_safe_discard: 0.0
reward_rank_bonus: 0.1

# Auxiliary tasks — reduced weight as model matures
aux_shanten_weight: 0.5
aux_opp_waits_weight: 0.2

# PPO — conservative updates for fine-tuning
learning_rate: 1e-4
lr_schedule: kl_adaptive_minibatch
ppo_clip_ratio: 0.1
max_grad_norm: 0.5
gamma: 0.999
gae_lambda: 0.97
exploration_loss_coeff: 0.005
value_loss_coeff: 1.0
train_for_env_steps: 50000000

# Input normalization
normalize_input: true
normalize_input_keys: ["obs", "oracle_obs"]

# RTPA — enable runtime policy adaptation during evaluation
rtpa_enabled: true
rtpa_attack_temp: 0.8
rtpa_defend_temp: 1.5

# ISMCE — enable during evaluation (not training)
ismce_enabled: true
ismce_num_worlds: 64
ismce_rollout_depth: 4
