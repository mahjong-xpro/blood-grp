# ⚠️ Architecture params (blood_num_tile_attn_layers, oracle_num_tile_attn_layers,
#    rnn_num_layers) MUST be identical across ALL training stages.
#    Changing them between stages will cause checkpoint weight shape mismatches.

# Phase 2: Self-Play — 自博弈强化
# Duration: ~20M env steps
# Goal: 学会对抗性策略、防守、番型规划、排名意识
# Opponents: 联赛自博弈
# Oracle: 完整蒸馏（policy + value）
# 合并原 competitive + competitive_distill

# --- 硬件 (8×4090 24GB + 128 核 CPU) ---
# SF2 learner 单卡训练，batch_size 受单卡 24GB 限制
num_workers: 48
num_envs_per_worker: 8
batch_size: 2048                   # 单卡 24GB 上限
num_batches_per_epoch: 8           # 更多梯度更新提高样本效率

# --- PPO ---
ppo_clip_ratio: 0.15               # 收紧，自博弈需要稳定
max_grad_norm: 2.0
gamma: 0.998                       # 长视野，学习跨局策略
gae_lambda: 0.95
learning_rate: 1e-4
lr_schedule: kl_adaptive_minibatch
lr_schedule_kl_threshold: 0.002
lr_adaptive_max: 2e-4
lr_adaptive_min: 3e-5
exploration_loss_coeff: 0.03       # 初始高探索
value_loss_coeff: 0.5              # 降低 critic 权重，避免 critic 主导
train_for_env_steps: 20000000

# --- Environment ---
initial_score: 100000
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_selfplay

# --- Model (与所有阶段保持一致: 256ch/20blocks Bottleneck, obs=473) ---
blood_obs_channels: 473
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024
blood_enc_proj_layers: 3               # SpatialPoolingProj: 注意力池化保留牌位结构
blood_num_tile_attn_layers: 4
blood_tile_attn_heads: 4

# --- 对手 ---
opponent_mode: selfplay
opponent_refresh_every: 20

# --- Oracle（完整蒸馏） ---
oracle_enabled: true
oracle_num_blocks: 10
oracle_num_tile_attn_layers: 2
oracle_tile_attn_heads: 4
oracle_distill_weight: 0.03
oracle_distill_temperature: 2.0
oracle_ce_weight: 0.05
oracle_value_distill_weight: 0.1       # 启用 value 蒸馏
oracle_value_head_loss_weight: 0.5
oracle_value_warmup_steps: 0

# --- 奖励塑形（平滑过渡） ---
warmup_reward_shaping: false           # 关闭 warmup 奖励
reward_tsumo_bonus: 0.15
reward_deal_in_penalty: 0.08
reward_shanten_progress: 0.005
reward_shanten_regress: 0.001
shanten_fan_bonus_scale: 0.2           # 开始引导番数意识
shanten_fan_max: 8.0
reward_rank_bonus: 0.2
reward_safe_discard: 0.005             # 降低到 0.005，避免累积过度防守

# --- 向听衰减 ---
shanten_reward_decay_steps: 15000000   # 在 20M 步中前 15M 步衰减
shanten_reward_min_ratio: 0.3

# --- 辅助任务 ---
aux_shanten_weight: 1.0
aux_opp_waits_weight: 0.3

# --- LSTM ---
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 2
rollout: 32
recurrence: 32

# --- 联赛 ---
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 50000
league_newest_weight: 2.0
league_uniform_floor: 0.1
league_self_play_prob: 0.15
league_frozen_window: 3
league_max_pool_size: 200

# --- 评估 ---
blood_arena_eval_every: 500000
blood_arena_eval_games: 200            # 提升到 200 局，Elo 置信区间更窄
blood_arena_eval_temperature: 0.1

# --- 定缺 ---
dingque_prior_enabled: true
dingque_prior_warmup_steps: 100000
oracle_dingque_uniform: true
dingque_reward_shaping: false

# --- 对手手牌预测（从阶段 2 开始训练） ---
opponent_predictor_enabled: true
opponent_predictor_weight: 0.1

# --- 动态调度 ---
# Entropy: cosine 0.03 → 0.015 over 20M steps
blood_schedule_entropy: "cosine,0.03,0.015,0,20000000"

# --- 优势裁剪 ---
adv_clip: 3.0

# --- 数据增强 ---
suit_augment_prob: 0.5

# --- 性能 ---
use_mixed_precision: true
save_every_sec: 300
