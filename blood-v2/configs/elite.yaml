# ⚠️ Architecture params (blood_num_tile_attn_layers, oracle_num_tile_attn_layers,
#    rnn_num_layers) MUST be identical across ALL training stages.
#    Changing them between stages will cause checkpoint weight shape mismatches.

# Phase 3: Elite — fine-tuning for superhuman play
# Duration: ~50M env steps (从10M大幅提升，确保充分训练)
# Goal: maximize Elo through refined self-play + search
# Prerequisite: resume from competitive_distill checkpoint

# Sample Factory
num_workers: 16
num_envs_per_worker: 16
batch_size: 1024
num_batches_per_epoch: 8
ppo_clip_ratio: 0.15                   # Fix @Phase2b: 0.1 导致 fraction_clipped 9.5%，0.15 降到 4.1%
max_grad_norm: 3.0                     # Fix @Phase2b: 0.5 会导致 >90% 梯度截断；2.0 时 69%，3.0 时 37%
gamma: 0.999
gae_lambda: 0.97
learning_rate: 1e-4
lr_schedule: kl_adaptive_minibatch
lr_schedule_kl_threshold: 0.002    # Fix @Phase2b: 0.0002 远低于实际 KL(0.0015~0.002)，LR 100% 锁死下限
lr_adaptive_max: 2e-4              # 保持不变
lr_adaptive_min: 5e-5              # Fix @Phase2b: 2e-5 导致学习停滞（Phase 2b 旧 run 76.6% 锁死）
exploration_loss_coeff: 0.01
value_loss_coeff: 1.0
train_for_env_steps: 50000000       # 从10M提升到50M — 原规模严重不足

# Environment
initial_score: 100000
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_elite

# Model — 与 warmup.yaml/default.yaml 保持一致 (256ch/20blocks Bottleneck)
# 修复: 原 192ch/30blocks 为 V1 规格，无法加载 competitive 阶段的 256ch/20blocks 权重
# 修复: blood_obs_channels 384 → 470 (Rust NUM_STUDENT_CHANNELS=470)
blood_obs_channels: 470
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024
blood_enc_proj_layers: 3               # SpatialPoolingProj: 注意力池化保留牌位结构

blood_num_tile_attn_layers: 4
blood_tile_attn_heads: 4

# Opponents: neural self-play via league
opponent_mode: selfplay
opponent_refresh_every: 10

# Oracle distillation — minimal policy distillation; value distillation maintained
# oracle_value_distill_weight: 0.05 — reduced from Phase 2b (student should be maturing)
# oracle_value_head_loss_weight: 0.5 — keep oracle value head calibrated
# oracle_value_warmup_steps: 0 — no gate needed
oracle_enabled: true
oracle_num_blocks: 20
oracle_num_tile_attn_layers: 4
oracle_tile_attn_heads: 4
oracle_distill_weight: 0.01
oracle_distill_temperature: 1.5
oracle_ce_weight: 0.02
oracle_value_distill_weight: 0.05
oracle_value_head_loss_weight: 0.5
oracle_value_warmup_steps: 0

# Arena evaluation — periodic strength measurement via RuleBot games
blood_arena_eval_every: 500000         # evaluate every 500k steps (elite is 50M total)
blood_arena_eval_games: 100            # more games for stable Elo in elite phase
blood_arena_eval_temperature: 0.1

# League — very frequent snapshots for fine-grained progression
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 50000                 # 从 25000 提升到 50000，配合更大池保持覆盖范围
league_newest_weight: 2.0              # 与所有阶段保持一致
league_uniform_floor: 0.1
league_self_play_prob: 0.2
league_frozen_window: 3                # 最近3个checkpoint不参与采样，减少Elo振荡
league_max_pool_size: 200              # 从50扩容到200，覆盖更长训练历史

# No reward shaping
warmup_reward_shaping: false

# Data augmentation
suit_augment_prob: 0.5

# Structured reward shaping — 全部 score-weighted: intensity=clamp(sqrt(|Δ|/32000), 0.25, 1.0)
# 配置值为最大值，低番事件自动衰减
reward_tsumo_bonus: 0.1             # score-weighted: 1番自摸→0.031, 6番自摸→0.100
reward_deal_in_penalty: 0.05        # score-weighted: 1番放铳→0.014, 6番放铳→0.050
reward_shanten_progress: 0.003      # 基础值与 competitive 一致，通过衰减调度自动降低
reward_shanten_regress: 0.001       # 基础值与 competitive 一致，通过衰减调度自动降低

# 向听番数加权 — elite 阶段完整引导，充分利用番数信号优化手牌方向
shanten_fan_bonus_scale: 0.3
shanten_fan_max: 8.0

# 向听奖励衰减调度：在前 30M 步内从 100% 线性衰减到 30%
# 50M 步训练中，前 30M 步逐步降低向听信号，后 20M 步保持最低值
shanten_reward_decay_steps: 30000000
shanten_reward_min_ratio: 0.3

# 排名奖励 — score-weighted: sqrt(|Δscore|/32000) 加权，低番局自动衰减
reward_rank_bonus: 0.2              # 最大值；实际通过 intensity=sqrt(|Δ|/32000) ∈ [0.25,1.0] 加权

# 安全弃牌奖励 — 降低至 0.01 减少累积过度防守倾向
reward_safe_discard: 0.01           # 从 0.015 降到 0.01，缓解 entropy 下降

# Auxiliary tasks — reduced weight as model matures
aux_shanten_weight: 0.5
aux_opp_waits_weight: 0.2

# LSTM — temporal modeling across turns
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 2
rollout: 32
recurrence: 32

# Advantage clipping
adv_clip: 5.0

# RTPA — enable runtime policy adaptation during evaluation
rtpa_enabled: true
rtpa_attack_temp: 0.8
rtpa_defend_temp: 1.5

# ISMCE — enable during evaluation (not training)
ismce_enabled: true
ismce_num_worlds: 64
ismce_rollout_depth: 4

# Dynamic hyperparameter schedules (within this stage)
# Entropy: cosine anneal from 0.02 → 0.01 over full 50M steps
# 终值从 0.005 提升到 0.01 防止策略过早收敛
blood_schedule_entropy: "cosine,0.02,0.01,0,50000000"
# Adv clip: linear tighten from 5.0 → 3.0 starting at 10M steps
blood_schedule_adv_clip: "linear,5.0,3.0,10000000,40000000"

# Entropy floor safety net — 防止 entropy 意外降到极低值
blood_entropy_floor: 0.008
