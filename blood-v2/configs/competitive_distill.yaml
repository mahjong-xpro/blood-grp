# ⚠️ Architecture params (blood_num_tile_attn_layers, oracle_num_tile_attn_layers,
#    rnn_num_layers) MUST be identical across ALL training stages.
#    Changing them between stages will cause checkpoint weight shape mismatches.

# Phase 2b: Competitive Distill — oracle value distillation enabled
# Duration: ~4M env steps
# Goal: student critic learns from oracle's perfect-info value estimates
# Prerequisite: resume from competitive (Phase 2a) checkpoint
#   - oracle_value_head_loss should have converged (blood/oracle_value_head_loss < 0.1)
#   - Typically after ~500K–1M env steps of Phase 2a

# Sample Factory
num_workers: 16
num_envs_per_worker: 16
batch_size: 1024
num_batches_per_epoch: 8
ppo_clip_ratio: 0.15                   # Fix @688K: 从 0.1 提升到 0.15，旧值导致 fraction_clipped 均值 10.2%（峰值 39.7%）
max_grad_norm: 3.0                     # Fix @688K: 从 2.0 提升到 3.0，旧值导致 70.2% 步骤梯度被截断
gamma: 0.998
gae_lambda: 0.95
learning_rate: 1e-4
lr_schedule: kl_adaptive_minibatch
lr_schedule_kl_threshold: 0.0005       # Fix @2.2M: 从 0.0002 提升到 0.0005，匹配实际 KL 均值（0.0004）
                                       # 旧值 0.0002 导致 KL>threshold 的时间过多，LR 被持续压低
lr_adaptive_max: 2e-4                  # 保持不变
lr_adaptive_min: 5e-5                  # Fix @2.2M: 从 2e-5 提升到 5e-5，旧值导致 LR 76.6% 时间锁死在下限
exploration_loss_coeff: 0.05
value_loss_coeff: 1.0
train_for_env_steps: 4000000

# Environment
initial_score: 100000
env: blood_mahjong
encoder_custom: blood_encoder
experiment: blood_v2_competitive_distill

# Model — 与 warmup.yaml/default.yaml 保持一致 (256ch/20blocks Bottleneck)
blood_obs_channels: 473
blood_conv_channels: 256
blood_num_res_blocks: 20
blood_encoder_out_dim: 1024
blood_enc_proj_layers: 3               # SpatialPoolingProj: 与所有阶段保持一致
blood_num_tile_attn_layers: 4
blood_tile_attn_heads: 4

# Opponents: neural self-play via league
opponent_mode: selfplay
opponent_refresh_every: 20

# Oracle distillation — value distillation now active
# oracle_value_distill_weight: 0.1 — student critic targets oracle value estimates
# oracle_value_head_loss_weight: 0.5 — reduced (head already converged in Phase 2a)
# oracle_value_warmup_steps: 0 — no gate needed; we're already past warmup
oracle_enabled: true
oracle_num_blocks: 20
oracle_num_tile_attn_layers: 4
oracle_tile_attn_heads: 4
oracle_distill_weight: 0.01
oracle_distill_temperature: 2.0
oracle_ce_weight: 0.05
oracle_value_distill_weight: 0.1
oracle_value_head_loss_weight: 0.5
oracle_value_warmup_steps: 0

# Arena evaluation — periodic strength measurement via RuleBot games
blood_arena_eval_every: 200000         # evaluate every 200k steps (distill is 4M total)
blood_arena_eval_games: 100            # Fix @2.2M: 从 50 提升到 100，减少单次评估方差（95% CI 从 ±14% 缩小到 ±10%）
blood_arena_eval_temperature: 0.1

# League — same cadence as Phase 2a
league_enabled: true
league_pool_dir: checkpoints/league/
league_add_every: 50000
league_newest_weight: 2.0              # 与所有阶段保持一致
league_uniform_floor: 0.1
league_self_play_prob: 0.2
league_frozen_window: 3                # 最近3个checkpoint不参与采样
league_max_pool_size: 200              # 与所有阶段保持一致
save_every_sec: 30

# No reward shaping — pure score-based reward
warmup_reward_shaping: false

# Data augmentation
suit_augment_prob: 0.5

# Structured reward shaping — score-weighted: intensity=clamp(sqrt(|delta|/32000), 0.25, 1.0)
reward_tsumo_bonus: 0.1             # score-weighted: 1番自摸→0.031, 6番自摸→0.100
reward_deal_in_penalty: 0.05        # score-weighted: 1番放铳→0.014, 6番放铳→0.050
reward_shanten_progress: 0.003
reward_shanten_regress: 0.001

# 向听番数加权 — 与 competitive 保持一致
shanten_fan_bonus_scale: 0.15
shanten_fan_max: 8.0

# 排名奖励 — 血战麻将的核心目标是排名而非单局得分
# 与 competitive.yaml 保持一致，持续强化排名意识
reward_rank_bonus: 0.15             # score-weighted: effective ∈ [0.04, 0.15]

# 安全弃牌奖励 — 补充防守信号
# 与 competitive.yaml 保持一致
reward_safe_discard: 0.015          # score-weighted shaping 会自动调节实际影响

# Auxiliary tasks
aux_shanten_weight: 1.0
aux_opp_waits_weight: 0.3

# LSTM
use_rnn: true
rnn_type: lstm
rnn_size: 512
rnn_num_layers: 2
rollout: 32
recurrence: 32

# Advantage clipping — same as Phase 2a
adv_clip: 2.0

# Dynamic hyperparameter schedules
# Entropy: cosine decay from 0.05 → 0.02 over 4M steps
# Phase 2a ended at 0.05 (schedule completed); gradually tighten as value distill stabilizes
blood_schedule_entropy: "cosine,0.05,0.02,0,4000000"

# Opponent hand predictor — 从 Phase 2b 开始训练 (需 Oracle 标签)
# 在 elite 阶段集成到 ISMCE informed sampling
opponent_predictor_enabled: true
opponent_predictor_conv_ch: 128
opponent_predictor_num_blocks: 6
opponent_predictor_weight: 0.1
